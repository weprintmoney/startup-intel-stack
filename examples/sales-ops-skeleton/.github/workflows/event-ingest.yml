name: Event Ingest

on:
  workflow_dispatch:
    inputs:
      event_file:
        description: "Path to the event attendee file in the repo (CSV or XLSX). Example: leads/sources/raise-summit-2026.xlsx"
        required: true
        type: string
      event_slug:
        description: "Short kebab-case label for this event. Used in output filename. Example: raise-summit-2026"
        required: true
        type: string

permissions:
  contents: read

jobs:
  event-ingest:
    name: Parse and classify event attendees
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write  # needed to trigger downstream workflows

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout internal docs for ICP criteria
        uses: actions/checkout@v4
        with:
          repository: <YOUR_ORG>/internal-docs
          token: ${{ secrets.INTERNAL_DOCS_PAT }}
          path: internal-docs
          sparse-checkout: |
            03-commercial-revenue/icp-filter-criteria.yaml

      - name: Set up Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Run event-ingest agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVENT_FILE: ${{ inputs.event_file }}
          EVENT_SLUG: ${{ inputs.event_slug }}
        run: |
          claude -p "$(cat agents/event-ingest/CLAUDE.md)" \
            --allowedTools "Bash,Read,Write" \
            --max-turns 40

      - name: Commit results
        run: |
          git config user.name "sales-ops-bot"
          git config user.email "sales-ops-bot@example.com"
          git add leads/raw/
          git diff --staged --quiet || git commit -m "event-ingest: ${{ inputs.event_slug }} $(date +%Y-%m-%d)"
          git push

      # Pipeline chain: dedup -> pre-filter -> enrichment -> dedup-review.
      # Pre-filter reads leads/deduped/, so dedup must run first.
      - name: Trigger dedup
        run: |
          gh workflow run dedup.yml \
            --repo ${{ github.repository }} \
            --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
