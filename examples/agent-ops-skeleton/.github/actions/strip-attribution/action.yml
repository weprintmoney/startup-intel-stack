name: Strip attribution
description: >
  Re-author all commits on the current branch (since base-ref) to the bot
  identity and strip Claude/AI attribution trailers from commit messages.
  Squashes the branch to a single clean commit — agent branches are
  short-lived, and one reviewable commit beats N noisy ones. Run this BEFORE
  pushing to any public repo; footprint-scan verifies the result.

inputs:
  bot-name:
    description: Commit author name
    default: example-app-eng-bot
  bot-email:
    description: Commit author email
    default: eng-bot@example.com
  base-ref:
    description: Base branch the agent branch forked from
    default: main
  message:
    description: Commit subject to use. If empty, the first commit's subject (scrubbed) is reused.
    default: ""

runs:
  using: composite
  steps:
    - name: Squash and re-author
      shell: bash
      env:
        BOT_NAME: ${{ inputs.bot-name }}
        BOT_EMAIL: ${{ inputs.bot-email }}
        BASE_REF: ${{ inputs.base-ref }}
        MESSAGE: ${{ inputs.message }}
      run: |
        set -euo pipefail
        git fetch origin "$BASE_REF" --quiet
        BASE=$(git merge-base HEAD "origin/$BASE_REF")
        if [ "$(git rev-parse HEAD)" = "$BASE" ]; then
          echo "No commits beyond origin/$BASE_REF — nothing to strip."
          exit 0
        fi

        # Combined message from all branch commits, minus attribution markers.
        SCRUB='(co-authored-by|generated with|generated by).*(claude|anthropic)|claude\.com|anthropic\.com|🤖'
        if [ -n "$MESSAGE" ]; then
          CLEAN_MSG="$MESSAGE"
        else
          CLEAN_MSG=$(git log --reverse --format='%B' "$BASE..HEAD" \
            | grep -viE "$SCRUB" \
            | awk 'NF {blank=0} !NF {blank++} blank<2' \
            | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')
        fi
        if [ -z "$CLEAN_MSG" ]; then
          echo "ERROR: commit message empty after scrubbing; pass an explicit message input." >&2
          exit 1
        fi

        git reset --soft "$BASE"
        git -c user.name="$BOT_NAME" -c user.email="$BOT_EMAIL" \
            commit --author="$BOT_NAME <$BOT_EMAIL>" -m "$CLEAN_MSG"
        echo "Re-authored $(git rev-parse --short HEAD) as $BOT_NAME <$BOT_EMAIL>."
