name: Strip attribution
description: >
  Re-author all commits on the current branch (since base-ref) to the bot
  identity and strip Claude/AI attribution trailers from commit messages.
  Squashes the branch to a single clean commit — agent branches are
  short-lived, and one reviewable commit beats N noisy ones. Run this BEFORE
  pushing to any public repo; footprint-scan verifies the result.

inputs:
  bot-name:
    description: Commit author name
    default: example-app-bot[bot]
  bot-email:
    description: Commit author email
    default: <APP_ID>+example-app-bot[bot]@users.noreply.github.com
  base-ref:
    description: >
      Base branch the agent branch forked from, or a full 40-hex commit SHA.
      A SHA squashes only the commits after it (revise.yml passes the PR head
      it started from, so each revision round lands as one bot commit).
    default: main
  message:
    description: Commit subject to use. If empty, the first commit's subject (scrubbed) is reused.
    default: ""
  message-file:
    description: Path to a file holding the full commit message (subject + body). Takes precedence over `message`.
    default: ""
  exclude-paths:
    description: >
      Space-separated paths to leave out of the squashed commit when they did
      not exist at base-ref (branch checkpoints such as plan.md / spec.md).
      They stay on disk.
    default: ""
  path:
    description: Directory of the git checkout to operate on.
    default: "."

runs:
  using: composite
  steps:
    - name: Squash and re-author
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        BOT_NAME: ${{ inputs.bot-name }}
        BOT_EMAIL: ${{ inputs.bot-email }}
        BASE_REF: ${{ inputs.base-ref }}
        MESSAGE: ${{ inputs.message }}
        MESSAGE_FILE: ${{ inputs.message-file }}
        EXCLUDE: ${{ inputs.exclude-paths }}
      run: |
        set -euo pipefail
        if [[ "$BASE_REF" =~ ^[0-9a-f]{40}$ ]]; then
          BASE="$BASE_REF"
          git merge-base --is-ancestor "$BASE" HEAD || { echo "ERROR: base SHA $BASE is not an ancestor of HEAD" >&2; exit 1; }
        else
          git fetch origin "$BASE_REF" --quiet
          BASE=$(git merge-base HEAD "origin/$BASE_REF")
        fi
        if [ "$(git rev-parse HEAD)" = "$BASE" ]; then
          echo "No commits beyond origin/$BASE_REF — nothing to strip."
          exit 0
        fi

        # Combined message from all branch commits, minus attribution markers.
        SCRUB='(co-authored-by|generated with|generated by).*(claude|anthropic)|claude\.com|anthropic\.com|🤖'
        if [ -n "$MESSAGE_FILE" ] && [ -s "$MESSAGE_FILE" ]; then
          CLEAN_MSG=$(grep -viE "$SCRUB" "$MESSAGE_FILE" | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')
        elif [ -n "$MESSAGE" ]; then
          CLEAN_MSG="$MESSAGE"
        else
          CLEAN_MSG=$(git log --reverse --format='%B' "$BASE..HEAD" \
            | grep -viE "$SCRUB" \
            | awk 'NF {blank=0} !NF {blank++} blank<2' \
            | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')
        fi
        if [ -z "$CLEAN_MSG" ]; then
          echo "ERROR: commit message empty after scrubbing; pass an explicit message input." >&2
          exit 1
        fi

        git reset --soft "$BASE"
        # Branch checkpoints that never existed at base leave the commit
        # (but stay on disk): they are pipeline artifacts, not product code.
        for p in $EXCLUDE; do
          if ! git cat-file -e "$BASE:$p" 2>/dev/null && git ls-files --error-unmatch -- "$p" >/dev/null 2>&1; then
            git rm -q --cached -- "$p"
            echo "Excluded $p from the squashed commit."
          fi
        done
        if git diff --cached --quiet; then
          echo "Nothing left to commit after exclusions — resetting to $BASE."
          git reset -q --hard "$BASE"
          exit 0
        fi
        git -c user.name="$BOT_NAME" -c user.email="$BOT_EMAIL" \
            commit --author="$BOT_NAME <$BOT_EMAIL>" -m "$CLEAN_MSG"
        echo "Re-authored $(git rev-parse --short HEAD) as $BOT_NAME <$BOT_EMAIL>."
