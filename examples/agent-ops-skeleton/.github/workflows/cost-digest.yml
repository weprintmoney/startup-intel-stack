name: Cost Digest

# Guardrail 1a (terminus/operational-guardrails.md): weekly spend digest with
# a real ceiling — ADVISORY. Reads the last 7 days from the Anthropic
# cost-report API, grouped by workspace, and compares the *agent-ops
# workspace* slice to repo variable WEEKLY_COST_CEILING_USD:
#   >= 70%  -> warning in the digest
#   >= 100% -> loud alert telling a human to set AGENT_OPS_PAUSED=true
#
# This workflow does NOT pause the pipeline — it's the human-readable weekly
# report. It used to try pausing by PATCHing the AGENT_OPS_PAUSED repo
# variable with secrets.GITHUB_TOKEN — that can never work (Actions variables
# need admin/PAT; the default token 403s regardless of `actions: write`), and
# the dead branch shipped a "HARD STOP required but setting AGENT_OPS_PAUSED
# failed" alert once that read like an emergency.
#
# The actual enforcement — checking spend far more often than twice a week
# and setting AGENT_OPS_PAUSED=true the moment the ceiling is hit — lives in
# budget-guard.yml, which mints a example-app-bot token
# instead of using GITHUB_TOKEN. See that file for why this one couldn't.
#
# Scoping: cost_report is an ORG-WIDE endpoint. Un-grouped, it returns every
# dollar the Anthropic org spends — every Claude Code seat, every other repo's
# workflows, product API traffic — which is not what a weekly *pipeline*
# ceiling means. We therefore request group_by[]=workspace_id and check only
# vars.ANTHROPIC_WORKSPACE_ID (SETUP.md §4: the pipeline key runs under the
# agent-ops workspace precisely so its budget is isolated from interactive
# use). Org-wide total is still reported, as unchecked context.
#   - cost_report has no workspace_ids[] filter (that exists only on
#     usage_report/messages), so grouping + client-side selection is the only
#     way to scope it.
#   - Results paginate (has_more / next_page); grouping multiplies bucket
#     count, so following pages is mandatory, not optional.
#
# The Thursday run is a QUIET ceiling check: same math, but it only posts to
# Slack at >=70% or on API failure. Without it, a Tuesday cost blowout runs
# blind until the following Monday's digest.
#
# Degrades gracefully pre-setup: missing key/ceiling/workspace posts a
# warning instead of failing silently.
#
# Auth note: a developer service-account ANTHROPIC_API_KEY
# is authorized for both regular API calls AND the org cost_report endpoint.
# We check ANTHROPIC_ADMIN_KEY first for forward-compat with a possible
# dedicated admin key later, then fall back to ANTHROPIC_API_KEY.

on:
  schedule:
    # Monday 8 AM ET (13:00 UTC) — full digest
    - cron: "0 13 * * 1"
    # Thursday 8 AM ET (13:00 UTC) — quiet mid-week ceiling check
    - cron: "0 13 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cost-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No `actions: write` — this job no longer writes repo variables.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute spend and report against ceiling
        env:
          ANTHROPIC_ADMIN_KEY: ${{ secrets.ANTHROPIC_ADMIN_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_OPS_CHANNEL_ID: ${{ vars.SLACK_OPS_CHANNEL_ID }}
          REPO: ${{ github.repository }}
          CEILING: ${{ vars.WEEKLY_COST_CEILING_USD }}
          PAUSED: ${{ vars.AGENT_OPS_PAUSED }}
          WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          QUIET: ${{ github.event.schedule == '0 13 * * 4' }}
        run: |
          python - <<'PYEOF'
          import json, os, subprocess, urllib.parse, urllib.request
          from datetime import datetime, timedelta, timezone

          REPO = os.environ["REPO"]
          # Prefer a dedicated admin key if one is set (forward-compat);
          # fall back to the pipeline API key, which is a
          # developer service-account key authorized for cost_report too.
          admin_key = os.environ.get("ANTHROPIC_ADMIN_KEY", "") or os.environ.get("ANTHROPIC_API_KEY", "")
          ceiling_raw = os.environ.get("CEILING", "").strip()
          workspace = os.environ.get("WORKSPACE_ID", "").strip()
          paused = os.environ.get("PAUSED", "") == "true"
          quiet = os.environ.get("QUIET", "") == "true"
          now = datetime.now(timezone.utc)

          def slack(text):
              # Delegates to the one canonical implementation (echoes to the
              # log itself, degrades to log-only when SLACK_BOT_TOKEN is
              # unset, and posts to ${SLACK_OPS_CHANNEL_ID}) instead of reimplementing
              # the chat.postMessage call inline.
              subprocess.run(["bash", "scripts/slack-alert.sh", text], check=False)

          def emit(lines, force=False):
              """Post unless this is the quiet mid-week run and nothing is wrong."""
              text = "\n".join(lines)
              if quiet and not force:
                  print(text + "\n(quiet mid-week check — nothing above threshold; not posted)")
              else:
                  slack(text)

          if not admin_key:
              emit([f"*Cost digest — {REPO}*",
                    ":warning: Neither `ANTHROPIC_ADMIN_KEY` nor `ANTHROPIC_API_KEY` is set; cannot read spend."
                    " See SETUP.md §4. Guardrail 1a is NOT reporting until one is configured."])
              raise SystemExit(0)

          start = (now - timedelta(days=7)).replace(hour=0, minute=0, second=0, microsecond=0)

          # group_by[] must keep its literal brackets, so build the query by hand.
          base = ("https://api.anthropic.com/v1/organizations/cost_report"
                  f"?starting_at={start.strftime('%Y-%m-%dT%H:%M:%SZ')}"
                  "&bucket_width=1d&limit=31&group_by[]=workspace_id")

          buckets, page, pages = [], None, 0
          try:
              while True:
                  url = base + (f"&page={urllib.parse.quote(page)}" if page else "")
                  req = urllib.request.Request(url, headers={
                      "x-api-key": admin_key,
                      "anthropic-version": "2023-06-01",
                  })
                  with urllib.request.urlopen(req, timeout=30) as r:
                      payload = json.load(r)
                  buckets.extend(payload.get("data", []) or [])
                  pages += 1
                  page = payload.get("next_page")
                  # Cap pages so a pagination bug can't spin this job forever.
                  if not payload.get("has_more") or not page or pages >= 20:
                      break
          except Exception as e:
              slack(f"*Cost digest — {REPO}*\n:warning: cost-report API call failed: `{e}`."
                    " Spend unknown; treat as ceiling-unknown and check the Console.")
              raise SystemExit(1)

          # Sum per workspace. The default workspace reports workspace_id: null.
          # Amounts are decimal strings in the LOWEST unit — cents, per the
          # Usage & Cost API docs ("Currency: All costs in USD, reported as
          # decimal strings in lowest units (cents)") — not dollars. Found in
          # practice: this script (both here and in metrics-digest.yml) was
          # treating cents as dollars, a 100x inflation that made a normal,
          # if uneven, week of spend read as a blowout.
          by_ws = {}
          for bucket in buckets:
              for row in bucket.get("results", []) or []:
                  try:
                      amount = float(row.get("amount")) / 100.0
                  except (TypeError, ValueError):
                      continue
                  by_ws[row.get("workspace_id")] = by_ws.get(row.get("workspace_id"), 0.0) + amount

          org_total = sum(by_ws.values())
          print(f"pages={pages} buckets={len(buckets)} workspaces={len(by_ws)} org_total={org_total:.2f}")

          # Per-day series for whichever slice we're about to report (the
          # target workspace, or org-wide if unscoped), plus a same-day
          # outlier guard. This isn't about bad upstream data (that theory
          # was wrong — see the cents/dollars note above); it's just that a
          # single lopsided day used to be invisible inside one aggregate
          # number. Surface the daily shape so a genuinely busy day (or a
          # future real bug) is visible at a glance instead of asserting a
          # HARD STOP off a number nobody could see was lopsided.
          target = workspace if workspace else None
          daily = []
          for bucket in buckets:
              day_total = 0.0
              for row in bucket.get("results", []) or []:
                  if target is not None and row.get("workspace_id") != target:
                      continue
                  try:
                      day_total += float(row.get("amount")) / 100.0
                  except (TypeError, ValueError):
                      continue
              daily.append((str(bucket.get("starting_at", "?"))[:10], day_total))

          anomaly = None
          amounts = sorted(a for _, a in daily)
          if len(amounts) >= 3:
              median = amounts[len(amounts) // 2]
              top_date, top_amt = max(daily, key=lambda t: t[1])
              if top_amt > max(20 * median, 200):
                  anomaly = (top_date, top_amt, median)

          daily_line = "Daily: " + ", ".join(f"{d} ${a:,.2f}" for d, a in daily)

          lines = [f"*Cost digest — {REPO}*"]
          missing_workspace = False

          if workspace:
              spend = by_ws.get(workspace, 0.0)
              lines.append(f"Pipeline spend last 7 days: *${spend:,.2f}* (`agent-ops` workspace)")
              lines.append(daily_line)
              lines.append(f"Org-wide spend, all workspaces: ${org_total:,.2f} _(context only — not ceiling-checked)_")
              if workspace not in by_ws:
                  missing_workspace = True
                  lines.append(":warning: No cost rows matched `ANTHROPIC_WORKSPACE_ID` in this window."
                               " Either the pipeline genuinely spent $0 (expected while paused)"
                               " or the variable points at the wrong workspace.")
          else:
              spend = org_total
              lines.append(f"Org-wide spend last 7 days: *${spend:,.2f}*")
              lines.append(daily_line)
              lines.append(":warning: `ANTHROPIC_WORKSPACE_ID` repo variable not set — this number is"
                           " the WHOLE organization (every Claude Code seat and every other repo),"
                           " not just this pipeline. The ceiling check below is therefore unscoped.")

          if anomaly:
              a_date, a_amt, a_median = anomaly
              mult = (a_amt / a_median) if a_median else float("inf")
              lines.append(f":mag: *Lopsided day:* {a_date} alone is ${a_amt:,.2f} — "
                           f"~{mult:.0f}x the window's median day (${a_median:,.2f}). Probably just"
                           " a genuinely busy day, not bad data — worth a glance in the Console"
                           " if the ceiling line below looks alarming.")

          if not ceiling_raw:
              lines.append(":warning: `WEEKLY_COST_CEILING_USD` repo variable not set — Guardrail 1"
                           " ceiling is still `$TBD` in operational-guardrails.md. Decide it (SETUP.md §5).")
              emit(lines, force=True)
              raise SystemExit(0)

          ceiling = float(ceiling_raw)
          pct = (spend / ceiling * 100) if ceiling > 0 else 0
          lines.append(f"Ceiling: ${ceiling:,.2f} — *{pct:.0f}%* used")

          if pct >= 100:
              lines.append(":rotating_light: *Ceiling exceeded* — this digest is advisory and does"
                           " NOT stop the pipeline. If it is running, set repo variable"
                           " `AGENT_OPS_PAUSED=true` to halt all non-exempt workflows, then review.")
          elif pct >= 70:
              lines.append(f":warning: {pct:.0f}% of weekly ceiling used — dream loop sheds first"
                           " if this trend continues.")

          if paused:
              lines.append("_Note: `AGENT_OPS_PAUSED` is currently `true` — pipeline is already stopped,"
                           " so recent spend is unlikely to be this pipeline._")

          emit(lines, force=(pct >= 70 or missing_workspace))
          PYEOF
