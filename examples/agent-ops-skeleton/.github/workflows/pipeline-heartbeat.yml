name: Pipeline Heartbeat

# Absence-alerting, cloned from sales-ops. GitHub alerts when a workflow RUN
# fails, but says nothing when a schedule silently stops firing. This check
# alerts on:
#   1. staleness — no successful run of a monitored workflow within its window
#   2. latest completed run of a monitored workflow failed
# Silence = healthy. Alerts go to the failure-alerts Slack channel.
# Mute a check pre-launch via repo variable HEARTBEAT_SKIP (comma-separated
# workflow filenames). Add workflows to MONITORED as phases come live.
#
# While AGENT_OPS_PAUSED=true, every pause-gated workflow concludes `skipped`
# and can never produce a fresh success, so its staleness window is
# uninformative — checking it just alerts daily for as long as the pause
# lasts. Those checks are skipped and reported as one log line instead.
# Gating is read from the workflow file, so a newly gated workflow needs no
# edit here. Run failures still alert: the workflows post their own Slack
# alert on failure, and a gated job that never starts cannot fail.

on:
  schedule:
    # 7:30 AM ET daily (12:30 UTC)
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/bot-identity

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check pipeline heartbeat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_OPS_CHANNEL_ID: ${{ vars.SLACK_OPS_CHANNEL_ID }}
          HEARTBEAT_SKIP: ${{ vars.HEARTBEAT_SKIP }}
          AGENT_OPS_PAUSED: ${{ vars.AGENT_OPS_PAUSED }}
        run: python scripts/heartbeat.py

