name: Lint

# The lint floor. ruff (Python style/complexity/import order),
# actionlint (workflow YAML, including its embedded shellcheck pass over
# every `run:` block), and shellcheck (the standalone scripts/*.sh files
# actionlint doesn't reach). Enforcing from the start.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ruff
        run: |
          pip install --quiet ruff
          ruff check .

      - name: actionlint (includes its shellcheck-on-run-blocks pass)
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      - name: shellcheck
        run: shellcheck scripts/*.sh
