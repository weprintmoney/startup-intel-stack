name: Schema Validate

# Every inter-stage artifact has a JSON Schema. This check keeps the
# schemas themselves valid, the fixtures conforming, and the live state/
# files conforming — so a malformed state write fails CI instead of
# silently corrupting the pipeline.

on:
  push:
    branches: [main]
    paths: ["schemas/**", "state/**", "guards/**", "scripts/update-ledger.py", "scripts/verify-claims.py", "scripts/verify-claims_test.py", "scripts/validate-judge-verdict.py", "scripts/validate-judge-verdict_test.py", "scripts/result-line.sh", "scripts/result-line_test.sh", "scripts/round-history.py", "scripts/round-history_test.py", "evals/ledger-cases/**", "scripts/dependabot-triage.py", "scripts/dependabot-triage_test.py", "scripts/app-installed-repos.py", "evals/dependabot-cases/**", "agents/**", "README.md", ".github/workflows/*.yml", "scripts/check-node-docs.py", "scripts/check-node-docs_test.py", "scripts/validate-state.py", "scripts/validate-state_test.py", "scripts/heartbeat.py", "scripts/heartbeat_test.py", "scripts/update-claim.sh", "scripts/update-claim_test.sh", "scripts/state-retry.sh", "scripts/commit-state.sh", "scripts/check-docs-sync.py", "scripts/check-docs-sync_test.py", "scripts/status-card.py", "scripts/status-card_test.py"]
  pull_request:
    paths: ["schemas/**", "state/**", "guards/**", "scripts/update-ledger.py", "scripts/verify-claims.py", "scripts/verify-claims_test.py", "scripts/validate-judge-verdict.py", "scripts/validate-judge-verdict_test.py", "scripts/result-line.sh", "scripts/result-line_test.sh", "scripts/round-history.py", "scripts/round-history_test.py", "evals/ledger-cases/**", "scripts/dependabot-triage.py", "scripts/dependabot-triage_test.py", "scripts/app-installed-repos.py", "evals/dependabot-cases/**", "agents/**", "README.md", ".github/workflows/*.yml", "scripts/check-node-docs.py", "scripts/check-node-docs_test.py", "scripts/validate-state.py", "scripts/validate-state_test.py", "scripts/heartbeat.py", "scripts/heartbeat_test.py", "scripts/update-claim.sh", "scripts/update-claim_test.sh", "scripts/state-retry.sh", "scripts/commit-state.sh", "scripts/check-docs-sync.py", "scripts/check-docs-sync_test.py", "scripts/status-card.py", "scripts/status-card_test.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jsonschema
        run: pip install --quiet "jsonschema[format]"

      - name: Validate-state unit tests
        run: python scripts/validate-state_test.py

      - name: Validate schemas, fixtures, and state
        run: python scripts/validate-state.py .

      - name: Ledger selftest (deterministic replay cases)
        run: python scripts/update-ledger.py --selftest evals/ledger-cases

      - name: Claim-verify unit tests
        run: python scripts/verify-claims_test.py

      - name: Judge-verdict validator unit tests
        run: python scripts/validate-judge-verdict_test.py

      - name: RESULT-line parser unit tests
        run: bash scripts/result-line_test.sh

      - name: Round-history unit tests
        run: python scripts/round-history_test.py

      - name: Dependabot-triage unit tests
        run: python scripts/dependabot-triage_test.py

      - name: Node-docs drift check unit tests
        run: python scripts/check-node-docs_test.py

      - name: Node-docs drift check
        run: python scripts/check-node-docs.py .

      - name: Heartbeat unit tests
        run: python scripts/heartbeat_test.py

      - name: Update-claim transition enforcement tests
        run: bash scripts/update-claim_test.sh

      - name: Docs-sync unit tests
        run: python3 scripts/check-docs-sync_test.py

      - name: Status-card unit tests (ticket card render/apply, outbox rules)
        run: python3 scripts/status-card_test.py
