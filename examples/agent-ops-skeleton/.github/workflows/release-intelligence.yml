name: Release Intelligence

# R1+R2 of the release-intelligence plan: score every merged PR in a
# example-app-core release against the target-ICP rubric (internal-docs
# 07-engineering-docs/release-intelligence/rubric.md), persist findings to
# state/releases/<tag>/, and open agent:proposed backlog tickets for the
# market-worthy ones. The system proposes; humans promote (swap the label to
# agent:queued + mode:claude-led) — that gate is permanent.
#
# Trigger note: GitHub `release` events only fire workflows in the repo that
# published the release, so agent-ops cannot subscribe to example-app-core
# directly. Two paths in: repository_dispatch from a thin caller workflow in
# the product repo (instant, optional), and a 6h cron poll that needs no
# product-repo change and doubles as the "release never processed" watchdog.
# rc/pre-releases and drafts are skipped.
#
# Claim-verify: after deterministic validation, the market-
# worthy findings' summaries + evidence are checked by the fresh-context
# claim-verifier against retired phrases / graph / invariants / changelog.
# The verdict is persisted to state/releases/<tag>/claim-verdict.json;
# findings with a contradicted claim are excluded from ticket drafting and
# unverified claims are footnoted on the ticket. The gate never fails the
# run (continue-on-error) — an outage is reported in the Slack notice.
#
# Confidentiality: ticket text is scanned against the prospect-name list
# fetched at run time from <YOUR_ORG>/sales-ops (never committed here, never
# echoed to logs). Guard is fail-closed: no list, no tickets.
# Degrades gracefully pre-setup (SETUP.md §2/§3): missing secrets -> no-op notice.

on:
  repository_dispatch:
    types: [release-published]
  schedule:
    - cron: "45 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)process; default = latest unprocessed non-prerelease"
        required: false
        default: ""
      lookback_days:
        description: "Override PR window start: N days before the release instead of the previous release"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-intelligence
  cancel-in-progress: false

jobs:
  release-intelligence:
    if: vars.AGENT_OPS_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # state/releases/<tag>/ commits
    env:
      PRODUCT_REPO: <YOUR_ORG>/example-app-core
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Gate on secrets
        id: gate
        env:
          K: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          C: ${{ vars.BOT_APP_CLIENT_ID }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$K" ] || [ -z "$C" ] || [ -z "$KEY" ]; then
            echo "Secrets/vars not configured (SETUP.md §2/§4) — release-intelligence is a no-op."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint product-repo token (read + issue write)
        if: steps.gate.outputs.go == 'true'
        id: bot-product
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: <YOUR_ORG>
          repositories: example-app-core
          permission-contents: read
          permission-pull-requests: read
          permission-issues: write

      - name: Mint internal-docs token (read)
        if: steps.gate.outputs.go == 'true'
        id: bot-docs
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: <YOUR_ORG>
          repositories: internal-docs
          permission-contents: read

      - uses: ./.github/actions/bot-identity
        if: steps.gate.outputs.go == 'true'

      - name: Detect unprocessed release
        id: detect
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ steps.bot-product.outputs.token }}
          TAG_INPUT: ${{ inputs.tag || github.event.client_payload.tag || '' }}
          LOOKBACK: ${{ inputs.lookback_days || '' }}
        run: |
          RELS=$(gh api "repos/$PRODUCT_REPO/releases?per_page=100" \
            --jq '[.[] | select(.prerelease == false and .draft == false)
                   | {tag: .tag_name, at: .published_at}]')
          if [ -n "$TAG_INPUT" ]; then
            TAG="$TAG_INPUT"
          else
            TAG=$(echo "$RELS" | jq -r '.[0].tag // empty')
          fi
          if [ -z "$TAG" ]; then
            echo "No stable releases found — nothing to do."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! echo "$RELS" | jq -e --arg t "$TAG" 'map(.tag) | index($t) != null' >/dev/null; then
            echo "::error::$TAG is not a published, non-prerelease release of $PRODUCT_REPO"
            exit 1
          fi
          if [ -f "state/releases/$TAG/findings.json" ] && [ -z "$TAG_INPUT" ]; then
            echo "$TAG already processed — nothing to do."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          WINDOW_END=$(echo "$RELS" | jq -r --arg t "$TAG" \
            '(map(.tag) | index($t)) as $i | .[$i].at')
          if [ -n "$LOOKBACK" ]; then
            WINDOW_START=$(date -u -d "$WINDOW_END - $LOOKBACK days" +%Y-%m-%dT%H:%M:%SZ)
          else
            WINDOW_START=$(echo "$RELS" | jq -r --arg t "$TAG" \
              '(map(.tag) | index($t)) as $i | .[$i + 1].at // "1970-01-01T00:00:00Z"')
          fi
          {
            echo "go=true"
            echo "tag=$TAG"
            echo "window_start=$WINDOW_START"
            echo "window_end=$WINDOW_END"
          } >> "$GITHUB_OUTPUT"
          echo "Processing $TAG (PR window $WINDOW_START .. $WINDOW_END)"

      - name: Checkout internal-docs (read-only)
        if: steps.detect.outputs.go == 'true'
        uses: actions/checkout@v4
        with:
          repository: <YOUR_ORG>/internal-docs
          token: ${{ steps.bot-docs.outputs.token }}
          path: internal-docs
          persist-credentials: false

      - name: Prepare miner input
        id: prep
        if: steps.detect.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ steps.bot-product.outputs.token }}
          TAG: ${{ steps.detect.outputs.tag }}
          WINDOW_START: ${{ steps.detect.outputs.window_start }}
          WINDOW_END: ${{ steps.detect.outputs.window_end }}
        run: |
          mkdir -p /tmp/mine-input /tmp/mine-output
          RUBRIC=internal-docs/07-engineering-docs/release-intelligence/rubric.md
          [ -f "$RUBRIC" ] || { echo "::error::rubric doc missing in internal-docs"; exit 1; }
          cp "$RUBRIC" /tmp/mine-input/rubric.md
          MW_MIN=$(sed -n 's/^market_worthy_min:[[:space:]]*//p' "$RUBRIC" | head -1)
          [ -n "$MW_MIN" ] || { echo "::error::market_worthy_min missing from rubric frontmatter"; exit 1; }
          echo "mw_min=$MW_MIN" >> "$GITHUB_OUTPUT"

          ICP=internal-docs/01-market-intelligence/ideal-customer-profile.mdx
          [ -f "$ICP" ] || { echo "::error::ICP doc missing in internal-docs"; exit 1; }
          cp "$ICP" /tmp/mine-input/icp.mdx

          jq '[(.nodes // .)[] | select(.graph_type == "positioning-claim")]' \
            internal-docs/.claude/indexes/graph.json > /tmp/mine-input/positioning-claims.json
          [ "$(jq length /tmp/mine-input/positioning-claims.json)" -gt 0 ] ||
            echo "::warning::no positioning-claim nodes found in graph.json"

          SIG_DIR=internal-docs/01-market-intelligence/analyst-signals
          for f in $(find "$SIG_DIR" -maxdepth 1 -type f -name '2*.md' 2>/dev/null | sort | tail -2); do
            { echo "## $(basename "$f")"; echo; cat "$f"; echo; } >> /tmp/mine-input/market-signals.md
          done
          [ -s /tmp/mine-input/market-signals.md ] ||
            echo "(no analyst-signals files found)" > /tmp/mine-input/market-signals.md

          RUBRIC_VERSION=$(git -C internal-docs log -1 --format=%H -- \
            07-engineering-docs/release-intelligence/rubric.md)
          jq -n --arg tag "$TAG" --arg repo "$PRODUCT_REPO" --arg url "$RUN_URL" \
                --arg rv "$RUBRIC_VERSION" --argjson mw "$MW_MIN" \
                '{release_tag: $tag, repo: $repo, run_url: $url,
                  rubric_version: $rv, market_worthy_min: $mw}' \
                > /tmp/mine-input/run-meta.json

          gh pr list -R "$PRODUCT_REPO" --state merged --base main \
            --search "merged:${WINDOW_START}..${WINDOW_END}" \
            --json number,title,url,body --limit 200 > /tmp/mine-input/prs.json
          N_PRS=$(jq length /tmp/mine-input/prs.json)
          echo "Found $N_PRS merged PRs in window."
          if [ "$N_PRS" -eq 0 ]; then
            jq --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '. + {generated_at: $now, findings: []}' \
              /tmp/mine-input/run-meta.json > /tmp/mine-output/release-findings.json
            echo "mine=false" >> "$GITHUB_OUTPUT"
          else
            echo "mine=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Claude Code
        if: steps.prep.outputs.mine == 'true'
        uses: ./.github/actions/setup-claude

      - name: Run release-intelligence-miner
        if: steps.prep.outputs.mine == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_CUSTOM_HEADERS: "anthropic-workspace-id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}"
          GH_TOKEN: ${{ steps.bot-product.outputs.token }}
          TAG: ${{ steps.detect.outputs.tag }}
        run: |
          # scripts/run-claude.sh prints the parsed result entry, the CLI's
          # stderr, and the stream tail on a non-zero exit (early failures showed only
          # "exit code 1" before it existed), then
          # propagates the code so `bash -e` stops the step here.
          bash scripts/run-claude.sh /tmp/mine.stream.jsonl "$(cat agents/release-intelligence-miner/CLAUDE.md)

          Task: mine the merged PRs of release $TAG in $PRODUCT_REPO for market-worthy findings and score each against the rubric.
          Inputs at: /tmp/mine-input
          Write output to: /tmp/mine-output/release-findings.json
          End with exactly one RESULT: line." \
            --allowedTools "Bash,Read,Write,Glob,Grep" \
            --model claude-sonnet-4-6 \
            --max-turns 40
          jq -rs '[.[] | select(.type == "result")] | last | .result // ""' /tmp/mine.stream.jsonl | tail -3

      - name: Log token usage (miner)
        if: always()
        run: bash scripts/log-token-usage.sh /tmp/mine.stream.jsonl

      - name: Validate findings (schema + arithmetic, deterministic)
        id: validate
        if: steps.detect.outputs.go == 'true'
        env:
          TAG: ${{ steps.detect.outputs.tag }}
          MW_MIN: ${{ steps.prep.outputs.mw_min }}
        run: |
          F=/tmp/mine-output/release-findings.json
          [ -f "$F" ] || { echo "::error::miner produced no release-findings.json"; exit 1; }
          jq -e --arg tag "$TAG" '.release_tag == $tag' "$F" >/dev/null ||
            { echo "::error::findings release_tag does not match $TAG"; exit 1; }
          jq -e --argjson mw "$MW_MIN" '.market_worthy_min == $mw' "$F" >/dev/null ||
            { echo "::error::findings market_worthy_min does not match rubric ($MW_MIN)"; exit 1; }
          pip install --quiet "jsonschema[format]"
          python scripts/validate-release-findings.py "$F"
          {
            echo "total=$(jq '.findings | length' "$F")"
            echo "worthy=$(jq '[.findings[] | select(.verdict == "market-worthy")] | length' "$F")"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout example-app-docs (public, read-only — changelog for claim-verify)
        if: steps.prep.outputs.mine == 'true' && steps.validate.outputs.worthy != '0'
        uses: actions/checkout@v4
        with:
          repository: <YOUR_ORG>/example-app-docs
          path: docs-public
          fetch-depth: 1
          persist-credentials: false

      - name: Claim-verify market-worthy findings (fresh context)
        # Only market-worthy findings are in scope — they are the ones that
        # become prospect-facing tickets. Retired positioning phrases are
        # contradicted deterministically; the model checks summaries against
        # the changelog / graph docs and evidence paths against what they
        # actually say. continue-on-error: a gate outage must not abandon a
        # scored release.
        id: verify
        if: steps.prep.outputs.mine == 'true' && steps.validate.outputs.worthy != '0'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_CUSTOM_HEADERS: "anthropic-workspace-id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}"
          GH_TOKEN: ${{ steps.bot-product.outputs.token }}
          TAG: ${{ steps.detect.outputs.tag }}
        run: |
          set -o pipefail
          mkdir -p /tmp/claim-verify
          cp /tmp/mine-output/release-findings.json /tmp/claim-verify/artifact.json
          python3 scripts/verify-claims.py sources \
            --internal-docs internal-docs --docs-repo docs-public --out /tmp/claim-verify/sources
          python3 scripts/verify-claims.py extract --kind release-findings \
            --artifact /tmp/claim-verify/artifact.json --artifact-ref "$TAG" \
            --sources /tmp/claim-verify/sources --internal-docs internal-docs \
            --out /tmp/claim-verify/claims.json
          jq -n --arg k release-findings --arg ref "$TAG" --arg url "$RUN_URL" \
            '{artifact_kind: $k, artifact_ref: $ref, run_url: $url}' > /tmp/claim-verify/run-meta.json
          bash scripts/run-claude.sh /tmp/claim-verify.stream.jsonl "$(cat agents/claim-verifier/CLAUDE.md)

          Inputs at: /tmp/claim-verify
          Write verdict to: /tmp/claim-verify/verdict.json" \
            --allowedTools "Bash,Read,Write,Glob,Grep" \
            --model claude-sonnet-4-6 \
            --max-turns 30 \
            || echo "::warning::claim-verifier errored — pending claims will aggregate as unverified"
          jq -rs '[.[] | select(.type == "result")] | last | .result // ""' /tmp/claim-verify.stream.jsonl | tail -2
          python3 scripts/verify-claims.py aggregate \
            --claims /tmp/claim-verify/claims.json --model-verdict /tmp/claim-verify/verdict.json \
            --run-url "$RUN_URL" --out /tmp/claim-verify/final.json --md /tmp/claim-verify/final.md
          {
            echo "verdict=$(jq -r .verdict /tmp/claim-verify/final.json)"
            echo "contradicted_prs=$(jq -c '[.claims[] | select(.verdict == "contradicted" and .finding_pr != null) | .finding_pr] | unique' /tmp/claim-verify/final.json)"
            echo "summary=$(jq -r '"\(.verdict) (\(.counts.contradicted) contradicted, \(.counts.unverified) unverified, \(.counts.verified) verified)"' /tmp/claim-verify/final.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Log token usage (claim-verifier)
        if: always()
        run: bash scripts/log-token-usage.sh /tmp/claim-verify.stream.jsonl

      - name: Commit findings to state
        if: steps.detect.outputs.go == 'true'
        env:
          TAG: ${{ steps.detect.outputs.tag }}
        run: |
          mkdir -p "state/releases/$TAG"
          cp /tmp/mine-output/release-findings.json "state/releases/$TAG/findings.json"
          bash scripts/commit-state.sh "state/releases/$TAG/findings.json" - \
            "release-intelligence: $TAG findings"

      - name: Commit claim verdict to state
        if: steps.verify.outcome == 'success'
        env:
          TAG: ${{ steps.detect.outputs.tag }}
        run: |
          cp /tmp/claim-verify/final.json "state/releases/$TAG/claim-verdict.json"
          bash scripts/commit-state.sh "state/releases/$TAG/claim-verdict.json" - \
            "release-intelligence: $TAG claim verdict"

      - name: Notify when nothing is market-worthy
        if: steps.detect.outputs.go == 'true' && steps.validate.outputs.worthy == '0'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_OPS_CHANNEL_ID: ${{ vars.SLACK_OPS_CHANNEL_ID }}
          TAG: ${{ steps.detect.outputs.tag }}
          TOTAL: ${{ steps.validate.outputs.total }}
        run: |
          bash scripts/slack-alert.sh ":mag: Release intelligence: $TAG scored — 0 of $TOTAL merged PRs market-worthy. No tickets proposed. $RUN_URL"

      # SALES-OPS ACCESS DEFERRED — pending a decision on PAT vs App-install for cross-boundary read of the prospect-names
      # list. Everything up to and including findings.json is unaffected;
      # ticket drafting + opening are held until the mechanism lands.
      # To re-enable: restore the mint step below, restore the SALES_TOKEN
      # env + gh fetch in the ticketgate step. SETUP.md §3 tracks status.
      #
      # - name: Mint sales-ops token (read)
      #   if: steps.detect.outputs.go == 'true' && steps.validate.outputs.worthy != '0'
      #   id: bot-sales
      #   continue-on-error: true
      #   uses: actions/create-github-app-token@v2
      #   with:
      #     app-id: ${{ vars.BOT_APP_CLIENT_ID }}
      #     private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      #     owner: <YOUR_ORG>
      #     repositories: sales-ops
      #     permission-contents: read

      - name: Gate ticket drafting (held pending sales-ops access decision)
        id: ticketgate
        if: steps.detect.outputs.go == 'true' && steps.validate.outputs.worthy != '0'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_OPS_CHANNEL_ID: ${{ vars.SLACK_OPS_CHANNEL_ID }}
          TAG: ${{ steps.detect.outputs.tag }}
          WORTHY: ${{ steps.validate.outputs.worthy }}
          CLAIM_SUMMARY: ${{ steps.verify.outputs.summary }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          echo "go=false" >> "$GITHUB_OUTPUT"
          if [ "$VERIFY_OUTCOME" = "success" ]; then
            CLAIMS="Claim-verify: $CLAIM_SUMMARY — state/releases/$TAG/claim-verdict.json."
          else
            CLAIMS="Claim-verify did NOT complete ($VERIFY_OUTCOME) — findings are unchecked."
          fi
          bash scripts/slack-alert.sh ":inbox_tray: Release intelligence: $TAG scored — $WORTHY market-worthy finding(s). $CLAIMS Ticket drafting held pending sales-ops access decision (SETUP.md §3). Findings written to state/releases/$TAG/findings.json — review manually and open tickets by hand if wanted. $RUN_URL"

      - name: Set up Claude Code (drafter)
        if: steps.ticketgate.outputs.go == 'true' && steps.prep.outputs.mine != 'true'
        uses: ./.github/actions/setup-claude

      - name: Run ticket-drafter
        if: steps.ticketgate.outputs.go == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_CUSTOM_HEADERS: "anthropic-workspace-id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}"
          TAG: ${{ steps.detect.outputs.tag }}
          CONTRADICTED_PRS: ${{ steps.verify.outputs.contradicted_prs || '[]' }}
        run: |
          mkdir -p /tmp/draft-input /tmp/draft-output
          # Findings with a contradicted claim never reach the drafter.
          jq --argjson bad "$CONTRADICTED_PRS" \
            '{release_tag, findings: [.findings[] | select(.verdict == "market-worthy" and ((.pr_number | IN($bad[])) | not))]}' \
            "state/releases/$TAG/findings.json" > /tmp/draft-input/findings.json
          echo "Drafting $(jq '.findings | length' /tmp/draft-input/findings.json) finding(s); excluded by claim-verify: $CONTRADICTED_PRS"
          cp /tmp/mine-input/run-meta.json /tmp/draft-input/run-meta.json
          bash scripts/run-claude.sh /tmp/draft.stream.jsonl "$(cat agents/ticket-drafter/CLAUDE.md)

          Task: draft one ticket per market-worthy finding for release $TAG.
          Inputs at: /tmp/draft-input (findings.json, run-meta.json)
          Write output to: /tmp/draft-output/ticket-<pr_number>.md, one file per finding
          End with exactly one RESULT: line." \
            --allowedTools "Read,Write,Glob" \
            --model claude-sonnet-4-6 \
            --max-turns 20
          jq -rs '[.[] | select(.type == "result")] | last | .result // ""' /tmp/draft.stream.jsonl | tail -3

      - name: Log token usage (drafter)
        if: always()
        run: bash scripts/log-token-usage.sh /tmp/draft.stream.jsonl

      # Fresh token: the miner+drafter can run for the better part of an
      # hour. Re-mint before the label create + issue create loop.
      - name: Mint product-repo token (open tickets)
        if: steps.ticketgate.outputs.go == 'true'
        id: bot-open
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: <YOUR_ORG>
          repositories: example-app-core
          permission-issues: write

      - name: Scan and open proposed tickets
        if: steps.ticketgate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ steps.bot-open.outputs.token }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_OPS_CHANNEL_ID: ${{ vars.SLACK_OPS_CHANNEL_ID }}
          TAG: ${{ steps.detect.outputs.tag }}
        run: |
          gh label create -R "$PRODUCT_REPO" "agent:proposed" --color BFD4F2 \
            --description "Proposed by release-intelligence; a human promotes to agent:queued" \
            2>/dev/null || true
          gh label create -R "$PRODUCT_REPO" "release-intelligence" --color 5319E7 \
            --description "Originated from a release-intelligence run" \
            2>/dev/null || true

          shopt -s nullglob
          URLS=()
          BLOCKED=0
          for f in /tmp/draft-output/ticket-*.md; do
            head -1 "$f" | sed 's/^TITLE:[[:space:]]*//' > /tmp/title.txt
            tail -n +2 "$f" | sed '/./,$!d' > /tmp/body.md
            # Footnote unverified claims from claim-verify on the ticket.
            PRN=$(basename "$f" .md | sed 's/^ticket-//')
            if [ -f /tmp/claim-verify/final.json ] && [[ "$PRN" =~ ^[0-9]+$ ]]; then
              UNV=$(jq -r --argjson n "$PRN" \
                '[.claims[] | select(.finding_pr == $n and .verdict == "unverified") | .claim]
                 | if length > 0 then "Claim check: \(length) unverified — " + join("; ") else empty end' \
                /tmp/claim-verify/final.json)
              [ -n "$UNV" ] && printf '\n%s\n' "$UNV" >> /tmp/body.md
            fi
            if ! bash scripts/prospect-name-scan.sh /tmp/prospect-names.txt /tmp/title.txt /tmp/body.md; then
              BLOCKED=$((BLOCKED + 1))
              echo "::warning::$(basename "$f") blocked by prospect-name guard — not opened"
              continue
            fi
            URL=$(gh issue create -R "$PRODUCT_REPO" --title "$(cat /tmp/title.txt)" \
              --body-file /tmp/body.md \
              --label "agent:proposed" --label "release-intelligence") ||
              { echo "::warning::issue create failed for $(basename "$f")"; continue; }
            gh project item-add 4 --owner <YOUR_ORG> --url "$URL" ||
              echo "::warning::Project #4 add failed for $URL (check App org-projects permission)"
            URLS+=("$URL")
          done

          printf '%s\n' "${URLS[@]:-}" | jq -R 'select(length > 0)' | jq -s \
            --arg tag "$TAG" --arg url "$RUN_URL" --argjson blocked "$BLOCKED" \
            '{release_tag: $tag, run_url: $url, blocked_by_name_guard: $blocked, issues: .}' \
            > "/tmp/proposed-tickets.json"
          mkdir -p "state/releases/$TAG"
          cp /tmp/proposed-tickets.json "state/releases/$TAG/proposed-tickets.json"
          bash scripts/commit-state.sh "state/releases/$TAG/proposed-tickets.json" - \
            "release-intelligence: $TAG proposed tickets"

          MSG=":package: Release intelligence: $TAG — ${#URLS[@]} template-update proposal(s) opened with agent:proposed (awaiting human promotion to agent:queued)."
          if [ "$BLOCKED" -gt 0 ]; then
            MSG="$MSG $BLOCKED draft(s) blocked by the prospect-name guard."
          fi
          for u in "${URLS[@]:-}"; do
            if [ -n "$u" ]; then
              MSG="$MSG"$'\n'"$u"
            fi
          done
          bash scripts/slack-alert.sh "$MSG"

      - name: Alert on failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_OPS_CHANNEL_ID: ${{ vars.SLACK_OPS_CHANNEL_ID }}
          TAG: ${{ steps.detect.outputs.tag }}
        run: |
          bash scripts/slack-alert.sh ":x: release-intelligence failed for ${TAG:-unknown release}. Abandoned — not retrying. $RUN_URL"
