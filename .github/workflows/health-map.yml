# Topic Cluster Health Map. Regenerates docs/04-marketing/health-map.md — the
# segment x content-type coverage matrix with ranked gap priorities that the
# content generation runbook reads at topic-selection time.
#
# Simplified from a source pipeline that ran a repo-specific Python generator; here
# the agent derives the matrix from the taxonomy, drafts, and published-content list.
#
# Triggers: weekly (Saturday, so the map is fresh before Monday content runs),
# a content-merged repository_dispatch you can send from your site repo's deploy
# workflow, or manual dispatch.
#
# Mode: find-leads (content ops). Exits with a notice in docs-only mode.
# Required secrets: ANTHROPIC_API_KEY (skips gracefully if absent).
name: Topic Cluster Health Map

on:
  schedule:
    - cron: "0 20 * * 6" # Saturdays 20:00 UTC — keep in sync with cadences.health_map in company-profile.yaml (add the key when you customize)
  workflow_dispatch:
  repository_dispatch:
    types: [content-merged]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Stage gate
        id: gate
        run: |
          MODE=$(yq '.company.mode // .company.stage // ""' company-profile.yaml)
          if [ "$MODE" = "docs-only" ] || [ "$MODE" = "pre-seed" ] || [ -z "$MODE" ]; then
            echo "::notice::Health Map needs mode find-leads or higher; company.mode is docs-only — skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate health map
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "ANTHROPIC_API_KEY not set — skipping"; exit 0; fi
          npm install -g @anthropic-ai/claude-code
          claude -p "Regenerate docs/04-marketing/health-map.md.
          1. Read the segment list from docs/04-marketing/content-ops/reference/taxonomy.md
             (vertical/segment beat) and icp.verticals in company-profile.yaml.
             Content types: tutorial, explainer, comparison, case-study, reactive.
          2. Inventory existing coverage: everything under
             docs/04-marketing/content-ops/drafts/ (queue, faq, and the topic history
             table in drafts/_topic-history.md if present), plus published pieces at
             the channels.blog_path from company-profile.yaml if set.
          3. Write the matrix: rows = segments, columns = content types; each cell
             covered / in-flight / gap. Below it, a ranked '## Gap priorities' list —
             highest-value segment gaps first.
          4. Use standard frontmatter, status 'approved' (it's generated), and refresh
             last_reviewed.
          Do not commit — the workflow commits." \
          --allowedTools "Read,Write,Edit,Glob,Grep,Bash(date:*)"

      - name: Commit updated health map
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "gtm-agent"
          git config user.email "agent@users.noreply.github.com"
          git add docs/04-marketing/health-map.md
          git diff --cached --quiet && exit 0
          git commit -m "content-ops: refresh topic-cluster health map $(date +%F)

          Agent: ci
          Triggered-By: health-map.yml"
          git pull --rebase origin main && git push
