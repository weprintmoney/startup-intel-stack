# Monthly canonical competitor refresh. For each competitor in company-profile.yaml,
# fetches their public pages (pricing, changelog/blog, security/trust), diffs against
# docs/01-market-intelligence/competitive-landscape.md, and opens a PR containing only
# verified changes with citations. Complements weekly-competitive-signals.yml:
# that workflow detects weekly deltas; this one refreshes the canonical snapshot.
#
# Mode: docs-only — content ops run in every mode; nothing here touches contact data.
# Required secrets: ANTHROPIC_API_KEY (skips gracefully if absent).
# Optional secrets: SLACK_WEBHOOK_URL (failure notifications).
name: Competitor Refresh

on:
  schedule:
    - cron: "0 11 1 * *" # 1st of the month, 11:00 UTC — keep in sync with cadences.competitor_refresh in company-profile.yaml (add the key when you customize)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Stage gate
        id: gate
        run: |
          MODE=$(yq '.company.mode // .company.stage // ""' company-profile.yaml)
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          # content ops run in every mode; no skip
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Run competitor refresh agent
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "ANTHROPIC_API_KEY not set — skipping"; exit 0; fi
          npm install -g @anthropic-ai/claude-code
          claude -p "Read company-profile.yaml (the 'competitors:' list) and
          docs/01-market-intelligence/competitive-landscape.md.
          For each competitor, fetch their pricing page, changelog/blog, and
          security/trust page. Diff what you find against the current landscape doc.
          Update the doc with VERIFIED changes only — every changed line cites the
          competitor's own primary source inline with the access date, phrased as
          'as of $(date +%F), [Competitor] [claim] per [their docs]'. If you cannot
          cite it from their own source, do not write it. Refresh the doc's
          last_reviewed frontmatter. If a change materially affects our positioning
          or comparison angle, flag it at the top of the PR body under
          '## Positioning impact'.
          Then: git config user.name 'gtm-agent'; git config user.email
          'agent@users.noreply.github.com'; create branch
          competitor-refresh/$(date +%Y-%m); commit with the trailers
          'Agent: ci' and 'Triggered-By: competitor-refresh.yml'; push and open a PR.
          If nothing changed, exit cleanly without committing or opening a PR." \
          --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch"

      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then echo "SLACK_WEBHOOK_URL not set — skipping"; exit 0; fi
          curl -sS -X POST "$SLACK_WEBHOOK_URL" -H 'Content-type: application/json' \
            -d "{\"text\":\"Workflow failed: ${{ github.workflow }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
