# AEO Gap Remediation. For each open "aeo-gap" issue (filed by aeo-monitoring.yml),
# drafts a FAQ/KB entry targeting the exact query phrasing that missed, and opens a
# PR adding it to docs/04-marketing/content-ops/drafts/faq/ for human review.
#
# Simplified from a source pipeline that pushed drafts to a separate website repo via
# a PAT. Here drafts land in this repo; publishing to your site is a human step after
# the PR merges (wire up your own publisher if your site lives in another repo).
#
# Triggers:
#   - issues labeled "aeo-gap" by a user (label events created by other workflows'
#     GITHUB_TOKEN do NOT trigger workflows — that's a GitHub rule)
#   - weekly Sunday sweep that picks up any open aeo-gap issue without a remediation
#     PR — this is the reliable path for bot-filed issues
#   - workflow_dispatch for manual sweeps
#
# Mode: find-leads (content ops). Exits with a notice in docs-only mode.
# Required secrets: ANTHROPIC_API_KEY (skips gracefully if absent).
name: AEO Gap Remediation

on:
  issues:
    types: [labeled]
  schedule:
    - cron: "0 8 * * 0" # Sundays 08:00 UTC — keep in sync with cadences.aeo_remediation_sweep in company-profile.yaml (add the key when you customize)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  discover:
    if: github.event_name != 'issues' || github.event.label.name == 'aeo-gap'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      issues: ${{ steps.find.outputs.issues }}
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage gate
        id: gate
        run: |
          MODE=$(yq '.company.mode // .company.stage // ""' company-profile.yaml)
          if [ "$MODE" = "docs-only" ] || [ "$MODE" = "pre-seed" ] || [ -z "$MODE" ]; then
            echo "::notice::AEO Gap Remediation needs mode find-leads or higher; company.mode is docs-only — skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Find issues needing remediation
        id: find
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            echo "issues=[${{ github.event.issue.number }}]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Sweep: open aeo-gap issues without a remediation marker comment
          eligible=""
          for n in $(gh issue list -R "$GITHUB_REPOSITORY" --label aeo-gap --state open --limit 100 --json number -q '.[].number'); do
            if ! gh issue view "$n" -R "$GITHUB_REPOSITORY" --json comments -q '.comments[].body' \
                 | grep -q "AEO gap remediation draft opened as a PR"; then
              eligible="$eligible,$n"
            fi
          done
          echo "issues=[${eligible#,}]" >> "$GITHUB_OUTPUT"

  remediate:
    needs: discover
    if: needs.discover.outputs.run == 'true' && needs.discover.outputs.issues != '[]' && needs.discover.outputs.issues != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        issue: ${{ fromJSON(needs.discover.outputs.issues) }}
      max-parallel: 3
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Draft FAQ remediation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ matrix.issue }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "ANTHROPIC_API_KEY not set — skipping"; exit 0; fi
          npm install -g @anthropic-ai/claude-code
          claude -p "Remediate the AEO gap in issue #$ISSUE_NUMBER of this repo.
          1. Read the issue (gh issue view $ISSUE_NUMBER) — it names the exact query
             phrasing that answer engines failed on.
          2. Read company-profile.yaml, docs/04-marketing/content-ops/CLAUDE.md, and
             the reference docs it lists (claims-vetted.md, format-rules.md,
             frontmatter-schemas.md, taxonomy.md). HARD STOP: if
             reference/claims-vetted.md still carries its SETUP NOTE (unreviewed) or
             has no vetted claims, comment that on the issue and exit — do not draft
             content with unvetted claims.
          3. Draft a FAQ/KB entry whose title mirrors the missed query verbatim and
             whose first sentence answers it directly. Follow format-rules.md; use
             only claims from claims-vetted.md; 300-600 words; standard frontmatter
             plus draft: true.
          4. Write it to docs/04-marketing/content-ops/drafts/faq/<kebab-slug>.md.
          5. git config user.name 'gtm-agent'; git config user.email
             'agent@users.noreply.github.com'; branch aeo-remediation/issue-$ISSUE_NUMBER;
             commit with the trailers 'Agent: ci' and
             'Triggered-By: aeo-gap-remediation.yml'; push; open a PR titled
             'aeo: FAQ draft for gap #$ISSUE_NUMBER' whose body links the issue with
             'Closes #$ISSUE_NUMBER'.
          6. Comment on the issue: 'AEO gap remediation draft opened as a PR.' with
             the PR link." \
          --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"

      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then echo "SLACK_WEBHOOK_URL not set — skipping"; exit 0; fi
          curl -sS -X POST "$SLACK_WEBHOOK_URL" -H 'Content-type: application/json' \
            -d "{\"text\":\"Workflow failed: ${{ github.workflow }} (issue #${{ matrix.issue }}) — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
