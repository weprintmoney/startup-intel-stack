# AEO (Answer Engine Optimization) Monitoring. Checks whether the company appears
# in LLM / answer-engine responses to the buyer queries that matter for its category,
# writes a dated results file, and files an "aeo-gap" issue for each miss so
# aeo-gap-remediation.yml can draft targeted content.
#
# Simplified from a source pipeline that used a custom checker script with dedicated
# OpenAI + Perplexity keys and a state branch. Here a single agent run does the
# checks (using OPENAI_API_KEY / PERPLEXITY_API_KEY directly when present, degrading
# to web search when not) and compares against the previous dated results file.
#
# Tier: seed (content ops). Exits with a notice at pre-seed.
# Required secrets: ANTHROPIC_API_KEY (skips gracefully if absent).
# Optional secrets: OPENAI_API_KEY, PERPLEXITY_API_KEY (more answer engines covered),
#                   SLACK_WEBHOOK_URL (failure notifications).
name: AEO Monitoring

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC — keep in sync with cadences.aeo_monitoring in company-profile.yaml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  aeo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Stage gate
        id: gate
        run: |
          STAGE=$(yq '.company.stage' company-profile.yaml)
          if [ "$STAGE" = "pre-seed" ]; then
            echo "::notice::AEO Monitoring is a seed-tier workflow; company.stage is pre-seed — skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure aeo-gap label exists
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "aeo-gap" \
            --description "AEO gap — company not appearing in answer-engine responses" \
            --color "E4E669" \
            --repo "${{ github.repository }}" 2>/dev/null || true

      - name: Run AEO check agent
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "ANTHROPIC_API_KEY not set — skipping"; exit 0; fi
          npm install -g @anthropic-ai/claude-code
          claude -p "Run the AEO check for this company.
          1. Read company-profile.yaml (company name, domain, one_liner, icp) and
             docs/01-market-intelligence/positioning.md if it exists.
          2. Build 10-15 buyer-intent queries a prospect would type into ChatGPT or
             Perplexity (category queries like 'best <category> for <vertical>',
             'alternatives to <top competitor>', and problem-phrased queries from the
             ICP's pains). Reuse the query list from the most recent file in
             docs/04-marketing/aeo/ if one exists, so results are comparable week to week.
          3. For each query, check whether the company (name or domain) appears in the
             answer. Use the OpenAI API (OPENAI_API_KEY) and Perplexity API
             (PERPLEXITY_API_KEY) via curl when those env vars are set; for any engine
             whose key is missing, fall back to WebSearch and note reduced coverage.
          4. Write docs/04-marketing/aeo/$(date +%F)-aeo-results.md with standard
             frontmatter: the query list, hit/miss per query per engine, coverage
             percentage, and the delta vs the previous results file.
          5. For each MISS that a prospect would plausibly ask, file a GitHub issue
             (gh issue create) labeled 'aeo-gap' — title 'AEO gap: <query>', body with
             the exact query phrasing, which engines missed, who answered instead, and
             a suggested content angle. Skip queries that already have an open
             aeo-gap issue.
          6. Commit the results file to main: git config user.name 'gtm-agent';
             git config user.email 'agent@users.noreply.github.com'; commit with the
             trailers 'Agent: ci' and 'Triggered-By: aeo-monitoring.yml';
             git pull --rebase origin main && git push." \
          --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch"

      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then echo "SLACK_WEBHOOK_URL not set — skipping"; exit 0; fi
          curl -sS -X POST "$SLACK_WEBHOOK_URL" -H 'Content-type: application/json' \
            -d "{\"text\":\"Workflow failed: ${{ github.workflow }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
