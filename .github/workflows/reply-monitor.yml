# Poll the outreach inbox for replies. Mode: find-and-draft.
# Hard rule: pause-on-reply — the moment a reply is detected, the contact's
# sequence_status is set to paused in the CRM and no further automated
# sends happen. Unsubscribe requests are auto-suppressed. Logic lives in
# lib/reply_monitor.py (tested — see lib/tests/).
name: Reply Monitor

on:
  schedule:
    # Hourly sweep on business days. Keep this at least as frequent as the
    # smtp-send cron so replies pause sequences before the next send batch.
    - cron: "0 8-23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Preflight (mode gate + IMAP secrets + config)
        id: gate
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
        run: |
          MODE=$(yq '.company.mode // .company.stage // ""' company-profile.yaml)
          rank() { case "$1" in docs-only|pre-seed) echo 0;; find-leads|seed) echo 1;; find-and-draft|series-a) echo 2;; *) echo -1;; esac; }
          if [ "$(rank "$MODE")" -lt 0 ]; then
            echo "::warning::company.mode '$MODE' is not recognized — expected docs-only, find-leads, or find-and-draft. Treating as docs-only."
          fi
          if [ "$(rank "$MODE")" -lt "$(rank find-and-draft)" ]; then
            echo "::notice::company.mode '$MODE' is below 'find-and-draft' — reply monitoring skipped (mode gate)."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$IMAP_HOST" ] || [ -z "$IMAP_USER" ] || [ -z "$IMAP_PASSWORD" ]; then
            echo "::notice::IMAP_HOST / IMAP_USER / IMAP_PASSWORD not fully set — skipping reply monitoring."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          {
            echo "run=true"
            echo "crm_secret=$(yq '.crm.api_key_secret // ""' company-profile.yaml)"
            echo "webhook_secret=$(yq '.channels.slack_webhook_secret // ""' company-profile.yaml)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install requests pyyaml

      - name: Poll for replies
        if: steps.gate.outputs.run == 'true'
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          CRM_API_KEY: ${{ secrets[steps.gate.outputs.crm_secret || 'CRM_API_KEY'] }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }} # optional; enables DM-ing REPLY_MONITOR_OWNER_UID / _ESCALATION_UID
          SLACK_WEBHOOK_URL: ${{ secrets[steps.gate.outputs.webhook_secret || 'SLACK_WEBHOOK_URL'] }}
          SLACK_SALES_REVIEW_CHANNEL: ${{ vars.SLACK_SALES_REVIEW_CHANNEL }} # optional team channel, in addition to the DMs above
          REPLY_MONITOR_OWNER_UID: ${{ vars.REPLY_MONITOR_OWNER_UID }} # optional; Slack user ID, requires SLACK_BOT_TOKEN to DM
          REPLY_MONITOR_ESCALATION_UID: ${{ vars.REPLY_MONITOR_ESCALATION_UID }} # optional; ditto, for normal (non-unsubscribe) replies
          SUPPRESSION_LIST_PATH: suppression/list.jsonl
        run: |
          PROVIDER=$(yq '.crm.provider // "none"' company-profile.yaml)
          if [ "$PROVIDER" != "none" ] && [ -z "$CRM_API_KEY" ]; then
            echo "::warning::crm.provider is '$PROVIDER' but its API key secret is unset — updating the local store only."
            export CRM_PROVIDER=none
          fi
          python3 lib/reply_monitor.py

      - name: Commit suppression + local CRM updates
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "gtm-agent"
          git config user.email "agent@users.noreply.github.com"
          for p in suppression/list.jsonl leads/crm-local; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "reply-monitor: suppression update $(date +%Y-%m-%dT%H:%M)

          Agent: reply-monitor
          Agent-Model: none
          Triggered-By: reply-monitor.yml"
            for i in 1 2 3 4 5; do
              if git push; then break; fi
              echo "Push rejected (attempt $i/5); rebasing on origin/main..."
              git pull --rebase origin main
              sleep $((i * 2))
            done
          fi
