# Absence-alerting for the pipeline's scheduled workflows. Mode: find-leads.
# GitHub alerts when a workflow RUN fails, but says nothing when a schedule
# silently stops firing or a workflow "succeeds" while producing nothing.
# This check alerts on:
#   1. staleness — no successful run of a monitored workflow within its window
#   2. latest completed run of a monitored workflow failed
#   3. CRITICAL — emails were sent recently but reply-monitor is stale, which
#      means the pause-on-reply hard rule is not being enforced
#   4. weekly-crawl succeeded but leads/raw/ has no fresh output (zero-output)
#
# Silence = healthy. Logic lives in lib/heartbeat.py (tested — see
# lib/tests/); the monitored set widens to the send-path workflows only in
# find-and-draft mode with a real email provider — with sending.provider
# "manual" those workflows are permanent no-ops and are never monitored,
# and the sends-without-reply-monitor check is silent. Alerts go to the
# configured Slack webhook (or a bot-token DM/
# channel if HEARTBEAT_ALERT_CHANNEL + SLACK_BOT_TOKEN are set); without
# either, findings only appear in the run log (the job still fails on
# problems, so GitHub's own notifications fire). To mute a check pre-launch
# (e.g. reply-monitor before DNS is live), set the repo variable
# HEARTBEAT_SKIP to a comma-separated list of workflow filenames.
name: Pipeline Heartbeat

on:
  schedule:
    # Morning review of the previous weekday + a mid-business-window check
    # (incl. the sends-without-reply-monitor critical check). See
    # cadences.pipeline_heartbeat in company-profile.yaml.
    - cron: "30 12 * * 2-6"
    - cron: "0 17 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Preflight (mode gate + config)
        id: gate
        run: |
          MODE=$(yq '.company.mode // .company.stage // ""' company-profile.yaml)
          rank() { case "$1" in docs-only|pre-seed) echo 0;; find-leads|seed) echo 1;; find-and-draft|series-a) echo 2;; *) echo -1;; esac; }
          if [ "$(rank "$MODE")" -lt 0 ]; then
            echo "::warning::company.mode '$MODE' is not recognized — expected docs-only, find-leads, or find-and-draft. Treating as docs-only."
          fi
          if [ "$(rank "$MODE")" -lt "$(rank find-leads)" ]; then
            echo "::notice::company.mode '$MODE' is below 'find-leads' — heartbeat skipped (mode gate)."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          {
            echo "run=true"
            echo "mode=$MODE"
            echo "provider=$(yq '.sending.provider // "resend"' company-profile.yaml)"
            echo "tz=$(yq '.company.hq_timezone // "UTC"' company-profile.yaml)"
            echo "webhook_secret=$(yq '.channels.slack_webhook_secret // ""' company-profile.yaml)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check pipeline heartbeat
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          STAGE: ${{ steps.gate.outputs.mode }}
          SENDING_PROVIDER: ${{ steps.gate.outputs.provider }}
          HQ_TZ: ${{ steps.gate.outputs.tz }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }} # optional; enables DM/channel-by-ID via HEARTBEAT_ALERT_CHANNEL
          SLACK_WEBHOOK_URL: ${{ secrets[steps.gate.outputs.webhook_secret || 'SLACK_WEBHOOK_URL'] }}
          HEARTBEAT_ALERT_CHANNEL: ${{ vars.HEARTBEAT_ALERT_CHANNEL }} # optional; channel or user ID, requires SLACK_BOT_TOKEN to DM
          HEARTBEAT_SKIP: ${{ vars.HEARTBEAT_SKIP }}
        run: python3 lib/heartbeat.py
