# Exemplar parameterized workflow. Pattern for all agent workflows in this template:
# least-privilege permissions, stage gate, config read from company-profile.yaml,
# output committed as dated files with provenance trailers.
name: Weekly Competitive Signals

on:
  schedule:
    - cron: "0 4 * * 1" # keep in sync with cadences.competitive_signals in company-profile.yaml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage gate
        id: gate
        run: |
          MODE=$(yq '.company.mode // .company.stage // ""' company-profile.yaml)
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          # competitive signals run in every mode; agents above the mode exit here instead

      - name: Run signals agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY || secrets.EXA_AI_API }} # optional; either secret name; agent degrades to web search if absent
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "ANTHROPIC_API_KEY not set — skipping"; exit 0; fi
          npm install -g @anthropic-ai/claude-code
          claude -p "Read company-profile.yaml and docs/01-market-intelligence/competitive-landscape.md.
          For each competitor in the config, research the last 7 days: launches, pricing changes,
          funding, hiring signals, notable content. Ground every item in a linked source.
          Write findings to docs/01-market-intelligence/signals/$(date +%F)-competitive-signals.md
          with standard frontmatter. If a finding invalidates something in our positioning or
          competitive-landscape docs, flag it at the top under '## Positioning impact'." \
          --allowedTools "Read,Write,WebSearch,WebFetch,Bash(date:*)"

      - name: Commit results
        run: |
          git config user.name "gtm-agent"
          git config user.email "agent@users.noreply.github.com"
          git add docs/01-market-intelligence/signals/
          git diff --cached --quiet && exit 0
          git commit -m "Weekly competitive signals $(date +%F)

          Agent: ci
          Triggered-By: weekly-competitive-signals.yml"
          git pull --rebase origin main && git push
