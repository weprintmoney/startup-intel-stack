# Daily deliverability health check for the send domain. Tier: series-a.
# Checks: (1) DNS blacklist status of company.send_domain via MXToolbox
# (optional; skipped without an API key), (2) Google Postmaster Tools
# complaint rate (stub until ADC/JWT auth is wired up — always reads 0.0).
# Breaching a threshold sets the SEQUENCES_PAUSED repo variable, which
# smtp-send checks before every batch. Logic lives in
# lib/deliverability_monitor.py (tested — see lib/tests/).
name: Deliverability Monitor

on:
  schedule:
    # Daily, before the send window opens. See cadences.deliverability_monitor
    # in company-profile.yaml.
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # set SEQUENCES_PAUSED repo variable

    steps:
      - uses: actions/checkout@v4

      - name: Preflight (stage gate + config)
        id: gate
        run: |
          STAGE=$(yq '.company.stage' company-profile.yaml)
          rank() { case "$1" in pre-seed) echo 0;; seed) echo 1;; series-a) echo 2;; *) echo 0;; esac; }
          if [ "$(rank "$STAGE")" -lt "$(rank series-a)" ]; then
            echo "::notice::company.stage '$STAGE' is below 'series-a' — deliverability monitoring skipped (stage gate)."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          SEND_DOMAIN=$(yq '.company.send_domain // ""' company-profile.yaml)
          if [ -z "$SEND_DOMAIN" ]; then
            echo "::notice::company.send_domain not set — skipping deliverability monitoring."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          {
            echo "run=true"
            echo "send_domain=$SEND_DOMAIN"
            echo "webhook_secret=$(yq '.channels.slack_webhook_secret // ""' company-profile.yaml)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install --quiet pyyaml

      - name: Check deliverability health
        if: steps.gate.outputs.run == 'true'
        env:
          SENDING_DOMAIN: ${{ steps.gate.outputs.send_domain }}
          # NOTE: MXToolbox's public blacklist-lookup endpoint is called
          # without an API key (see lib/deliverability_monitor.py) — a
          # pre-existing gap ported as-is, not newly introduced here.
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }} # optional; complaint-rate stub until wired up
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }} # optional; enables DM-ing DELIVERABILITY_ALERT_UID
          SLACK_WEBHOOK_URL: ${{ secrets[steps.gate.outputs.webhook_secret || 'SLACK_WEBHOOK_URL'] }}
          DELIVERABILITY_ALERT_CHANNEL: ${{ vars.DELIVERABILITY_ALERT_CHANNEL }} # optional; defaults to #leadership
          DELIVERABILITY_ALERT_UID: ${{ vars.DELIVERABILITY_ALERT_UID }} # optional; Slack user ID, requires SLACK_BOT_TOKEN to DM
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 lib/deliverability_monitor.py
