# Draft personalized touches for pending leads and open an approval PR.
# Mode: find-and-draft. Merging the PR is the human approval — nothing sends
# until the queue files land on main and smtp-send picks them up (or, with
# sending.provider "manual", manual-send-packet.yml compiles them for a human).
name: Sequence Enrollment

on:
  workflow_dispatch:
    inputs:
      max_leads:
        description: "Max leads to draft in this batch (keep low during warm-up)"
        default: "15"
      skip_crm_gate:
        type: boolean
        default: false
        description: "Skip the CRM sequence_status=pending check. Use while CRM custom fields are unprovisioned. Source of truth becomes leads/critic/*.json (PASS or warmup_promoted)."

permissions:
  contents: read

jobs:
  enroll:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Preflight (mode gate + secrets + grounding docs)
        id: gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          MODE=$(yq '.company.mode // .company.stage // ""' company-profile.yaml)
          rank() { case "$1" in docs-only|pre-seed) echo 0;; find-leads|seed) echo 1;; find-and-draft|series-a) echo 2;; *) echo -1;; esac; }
          if [ "$(rank "$MODE")" -lt 0 ]; then
            echo "::warning::company.mode '$MODE' is not recognized — expected docs-only, find-leads, or find-and-draft. Treating as docs-only."
          fi
          if [ "$(rank "$MODE")" -lt "$(rank find-and-draft)" ]; then
            echo "::notice::company.mode '$MODE' is below 'find-and-draft' — sequence enrollment skipped (mode gate)."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY not set — skipping enrollment."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Fail-closed: never draft without templates and rubric on disk.
          MISSING=""
          for f in docs/03-commercial-revenue/sequences/touch-1.md \
                   docs/03-commercial-revenue/rubrics/copy-evaluator.md; do
            [ -f "$f" ] || MISSING="$MISSING $f"
          done
          if [ -n "$MISSING" ]; then
            echo "::warning::Missing grounding docs:$MISSING — skipping enrollment (fail-closed)."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "crm_secret=$(yq '.crm.api_key_secret // ""' company-profile.yaml)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install requests pyyaml

      - name: Set up Claude Code
        if: steps.gate.outputs.run == 'true'
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Run enrollment agent
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CRM_API_KEY: ${{ secrets[steps.gate.outputs.crm_secret || 'CRM_API_KEY'] }}
          MAX_LEADS: ${{ inputs.max_leads }}
          SKIP_CRM_GATE: ${{ inputs.skip_crm_gate }}
        run: |
          # Prepend an explicit imperative — headless agents have been
          # observed printing a menu of what they *could* do instead of
          # doing it. The CLAUDE.md's "Execution contract" alone isn't
          # always sufficient.
          PROMPT=$'START NOW. Read the env vars (SKIP_CRM_GATE, MAX_LEADS), select eligible leads, and draft the queue files. Do not print options, do not ask what to do, do not offer a status check first. This is your batch run — write drafts to sends/queue/ and sends/linkedin/, then print a summary and exit.\n\n---\n\n'$(cat agents/sequence-enrollment/CLAUDE.md)
          claude -p "$PROMPT" \
            --allowedTools "Bash,Read,Write" \
            --max-turns 60

      - name: Check for drafts
        if: steps.gate.outputs.run == 'true'
        id: drafts
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain sends/)" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "No queue files drafted — nothing to enroll."
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      # Gate: blind evaluator scores each lead's touch-1 draft against the
      # copy-evaluator rubric. Separate Claude invocation — it never sees the
      # drafting agent's reasoning, only the drafts, the enrichment records,
      # and the rubric.
      - name: Run copy-evaluator gate
        if: steps.gate.outputs.run == 'true' && steps.drafts.outputs.any == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Same START-NOW prepend pattern as enrollment: without it the
          # evaluator has printed what it *would* do without writing the
          # verdicts file, tripping the downstream fail-closed step.
          PROMPT=$'START NOW. Score every touch-1 draft under sends/queue/ against the copy-evaluator rubric and write the batch verdict to sends/verdicts/YYYY-MM-DD.json (today, UTC). LinkedIn drafts under sends/linkedin/ are exempt and should NOT be scored. Do not print options, do not ask what to do — begin scoring and write the verdicts file.\n\n---\n\n'$(cat agents/copy-evaluator/CLAUDE.md)
          claude -p "$PROMPT" \
            --allowedTools "Bash,Read,Write" \
            --max-turns 40

      # Deterministic maker/checker split: the evaluator only writes verdicts;
      # this step moves FAILed leads' drafts to sends/rejected/ so they still
      # appear in the PR diff (rescuable) but never land in the send queue.
      # Fail-closed: missing verdicts file kills the run before any PR opens.
      - name: Move failed drafts out of the queue
        if: steps.gate.outputs.run == 'true' && steps.drafts.outputs.any == 'true'
        # Logic lives in lib/sequence_enrollment.py (tested — see lib/tests/).
        # It reads sending.provider so the PR body says what merge actually
        # does: sends on schedule (resend/sendgrid/mailgun) or compiles a
        # copy-paste packet + lead issues (manual).
        run: python3 lib/sequence_enrollment.py

      - name: Open approval PR
        if: steps.gate.outputs.run == 'true' && steps.drafts.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain sends/)" ]; then
            echo "All drafts failed the copy gate and nothing remains — check sends/verdicts/."
          fi
          BRANCH="enroll/$(date +%Y-%m-%d-%H%M)"
          git config user.name "gtm-agent"
          git config user.email "agent@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add sends/
          git commit -m "enroll: draft batch $(date +%F)

          Agent: sequence-enrollment
          Agent-Model: claude-code
          Triggered-By: sequence-enrollment.yml"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "Approve outreach batch $(date +%F)" \
            --body-file /tmp/pr-body.md
