# Weekly Engineering Signals. A technical counterpart to weekly-competitive-signals:
# scans competitor engineering blogs, changelogs, GitHub release cadence, relevant
# arXiv papers, and Hacker News discussions from the last 7 days, and opens a PR with
# a dated technical-signals file for your engineering lead to review.
#
# Simplified from a source pipeline that installed a headless-browser scraping stack
# and per-competitor state files; here the agent works with WebSearch/WebFetch and
# degrades gracefully when the optional Exa key is absent.
#
# Tier: pre-seed (signals run at every tier).
# Required secrets: ANTHROPIC_API_KEY (skips gracefully if absent).
# Optional secrets: EXA_API_KEY (better arXiv/HN discovery), SLACK_WEBHOOK_URL.
name: Weekly Engineering Signals

on:
  schedule:
    - cron: "0 6 * * 4" # Thursdays 06:00 UTC — keep in sync with cadences.engineering_signals in company-profile.yaml (add the key when you customize)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  engineering-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Stage gate
        id: gate
        run: |
          STAGE=$(yq '.company.stage' company-profile.yaml)
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          # engineering signals run at every tier; no skip

      - name: Run engineering signals agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }} # optional; agent degrades to web search if absent
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "ANTHROPIC_API_KEY not set — skipping"; exit 0; fi
          npm install -g @anthropic-ai/claude-code
          claude -p "Produce this week's engineering signals.
          1. Read company-profile.yaml (competitors, one_liner, icp.verticals) and
             docs/05-product/ for what our own product does, so you can judge relevance.
          2. For the last 7 days, scan: each competitor's engineering blog and
             changelog; their main open-source repos' release cadence (gh api /
             WebFetch); arXiv for papers in our technical category; Hacker News
             threads discussing our category or competitors. Use the Exa API via curl
             when EXA_API_KEY is set; otherwise use WebSearch and note reduced coverage.
          3. Flag: architecture changes, new technical capabilities, performance
             claims, notable hires/job postings signaling direction, and community
             criticism that maps to our differentiation. Ground every item in a linked
             primary source placed inline next to the claim.
          4. No file = no signal: if nothing material, exit cleanly without writing,
             committing, or opening a PR.
          5. Otherwise write
             docs/01-market-intelligence/signals/$(date +%F)-engineering-signals.md
             with standard frontmatter, a '## Summary' up top, then per-competitor and
             per-source sections. Flag anything that invalidates our differentiators
             under '## Positioning impact'.
          6. git config user.name 'gtm-agent'; git config user.email
             'agent@users.noreply.github.com'; branch engineering-signals/$(date +%F);
             commit with the trailers 'Agent: ci' and
             'Triggered-By: weekly-engineering-signals.yml'; push; open a PR titled
             'weekly engineering signals: $(date +%F)'." \
          --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch"

      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then echo "SLACK_WEBHOOK_URL not set — skipping"; exit 0; fi
          curl -sS -X POST "$SLACK_WEBHOOK_URL" -H 'Content-type: application/json' \
            -d "{\"text\":\"Workflow failed: ${{ github.workflow }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
