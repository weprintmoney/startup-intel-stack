# Analyst & Influencer Signals — VERTICAL-DEPENDENT, OFF BY DEFAULT.
# Only useful once analyst firms (Gartner/Forrester/IDC) and named influencers shape
# buying decisions in your category — typically B2B infrastructure/enterprise, rarely
# consumer or very early categories. If that's you, uncomment the cron below;
# otherwise leave it dispatch-only or delete the file.
#
# Weekly market-narrative sweep, distinct from per-competitor monitoring: analyst
# category (re)framings, influencer language gaining traction, and conference keynote
# themes. Surfaces new terminology that may warrant a messaging update.
#
# Tier: pre-seed (signals run at every tier).
# Required secrets: ANTHROPIC_API_KEY (skips gracefully if absent).
# Optional secrets: SLACK_WEBHOOK_URL (failure notifications).
name: Analyst & Influencer Signals

on:
  # Uncomment to enable the weekly run once you've confirmed this fits your category:
  # schedule:
  #   - cron: "30 4 * * 1" # Mondays 04:30 UTC — keep in sync with cadences.analyst_signals in company-profile.yaml (add the key when you customize)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  analyst-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Stage gate
        id: gate
        run: |
          STAGE=$(yq '.company.stage' company-profile.yaml)
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          # signals run at every tier; no skip

      - name: Run analyst signals agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "ANTHROPIC_API_KEY not set — skipping"; exit 0; fi
          npm install -g @anthropic-ai/claude-code
          claude -p "Run this week's analyst & influencer narrative sweep. You are
          looking at the MARKET NARRATIVE, not individual competitor moves.
          1. Read company-profile.yaml (one_liner, icp, competitors) and
             docs/01-market-intelligence/positioning.md to know our category and
             current messaging language.
          2. Analyst sweep (last 7 days): search Gartner, Forrester, and IDC sites
             and newsrooms for items naming our market category. Flag category
             (re)framings, new buyer definitions, and any tracked competitor named a
             leader/challenger. Never paraphrase gated reports you could not access —
             flag as 'gated, could not verify' with the headline only.
          3. Influencer sweep (last 7 days): search X/LinkedIn/blogs for high-
             engagement posts about our category. Flag new terminology for the
             problem we solve, criticism of incumbents that maps to our
             differentiation, and developer asks that match what we do. Only include
             posts with meaningful engagement — note the count as signal strength.
          4. Conference-theme sweep: newly published keynote abstracts or agendas in
             our category from the major events in our space.
          5. End with '## New terminology to track' and a '## Positioning update
             trigger?' yes/no — if yes, say what changed and route to the positioning
             owner for review.
          6. No file = no signal: if nothing material, exit cleanly without writing.
          7. Otherwise write
             docs/01-market-intelligence/signals/$(date +%F)-analyst-signals.md with
             standard frontmatter and inline citations; git config user.name
             'gtm-agent'; git config user.email 'agent@users.noreply.github.com';
             branch analyst-signals/$(date +%F); commit with the trailers 'Agent: ci'
             and 'Triggered-By: analyst-signals.yml'; push; open a PR titled
             'analyst signals: $(date +%F)'." \
          --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch"

      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then echo "SLACK_WEBHOOK_URL not set — skipping"; exit 0; fi
          curl -sS -X POST "$SLACK_WEBHOOK_URL" -H 'Content-type: application/json' \
            -d "{\"text\":\"Workflow failed: ${{ github.workflow }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
