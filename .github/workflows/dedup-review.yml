# Qualifier-critic gate + CRM pending upsert. Mode: find-leads.
# Leads only reach the CRM upsert with a PASS verdict from the
# qualifier-critic rubric. Fail-closed — no verdict, no upsert.
# Triggered by stack-profile.yml, or manually.
name: Dedup Review (critic gate + CRM upsert)

on:
  workflow_dispatch:
    inputs:
      warmup_mode:
        type: boolean
        default: false
        description: "Warmup override: promote top-N FAIL verdicts (score >= floor, no disqualifier hits) to PASS. For real-send warmup only."
      warmup_top_n:
        type: string
        default: "15"
        description: "Max leads to promote when warmup_mode=true"
      warmup_score_floor:
        type: string
        default: "30"
        description: "Minimum normalized critic score required for promotion"
      skip_downstream:
        type: boolean
        default: false
        description: "Don't chain into sequence-enrollment when this finishes (find-and-draft mode only)"

permissions:
  contents: read

jobs:
  dedup-review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # chain into sequence-enrollment in find-and-draft mode

    steps:
      - uses: actions/checkout@v4

      - name: Preflight (mode gate + secrets + config)
        id: gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          MODE=$(yq '.company.mode // .company.stage // ""' company-profile.yaml)
          rank() { case "$1" in docs-only|pre-seed) echo 0;; find-leads|seed) echo 1;; find-and-draft|series-a) echo 2;; *) echo -1;; esac; }
          if [ "$(rank "$MODE")" -lt 0 ]; then
            echo "::warning::company.mode '$MODE' is not recognized — expected docs-only, find-leads, or find-and-draft. Treating as docs-only."
          fi
          if [ "$(rank "$MODE")" -lt "$(rank find-leads)" ]; then
            echo "::notice::company.mode '$MODE' is below 'find-leads' — dedup-review skipped (mode gate)."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY not set — skipping dedup-review."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ ! -f docs/03-commercial-revenue/rubrics/qualifier-critic.md ]; then
            echo "::warning::qualifier-critic rubric missing at docs/03-commercial-revenue/rubrics/qualifier-critic.md — skipping (fail-closed)."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          {
            echo "run=true"
            echo "mode=$MODE"
            echo "crm_secret=$(yq '.crm.api_key_secret // ""' company-profile.yaml)"
            echo "drafts=$([ "$(rank "$MODE")" -ge "$(rank find-and-draft)" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install requests pyyaml

      - name: Check doc versions
        # Fails loud before scoring if the rubric moved without a matching
        # Calibrated-against update in the agent's CLAUDE.md — silent rubric
        # skew is a worse failure mode than a blocked run.
        if: steps.gate.outputs.run == 'true'
        run: python scripts/check_doc_version.py agents/qualifier-critic/CLAUDE.md

      - name: Set up Claude Code
        if: steps.gate.outputs.run == 'true'
        run: npm install -g @anthropic-ai/claude-code@latest

      # Gate: score every enriched lead against the qualifier-critic rubric
      # (docs/03-commercial-revenue/rubrics/qualifier-critic.md).
      - name: Run qualifier-critic gate
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "$(cat agents/qualifier-critic/CLAUDE.md)" \
            --allowedTools "Bash,Read,Write" \
            --max-turns 40

      - name: Commit critic verdicts
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -z "$(git status --porcelain leads/critic/)" ]; then
            echo "No new verdicts to commit."
            exit 0
          fi
          git config user.name "gtm-agent"
          git config user.email "agent@users.noreply.github.com"
          git add leads/critic/
          git commit -m "critic: qualifier verdicts $(date +%F)

          Agent: qualifier-critic
          Agent-Model: claude-code
          Triggered-By: dedup-review.yml"
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            echo "Push rejected (attempt $i/5); rebasing on origin/main..."
            git pull --rebase origin main
            sleep $((i * 2))
          done

      # Upsert PASS leads into the CRM as sequence_status: pending. Uses the
      # lib/crm.py adapter — works with the local store (crm.provider: none)
      # when no CRM is configured. Personalization copy is NOT stored in the
      # CRM; the sequence-enrollment agent draws it from the sequence
      # templates in docs/03-commercial-revenue/sequences/ at draft time.
      - name: Dedup and upsert to CRM as pending
        if: steps.gate.outputs.run == 'true'
        env:
          CRM_API_KEY: ${{ secrets[steps.gate.outputs.crm_secret || 'CRM_API_KEY'] }}
          SUPPRESSION_LIST_PATH: suppression/list.jsonl
          WARMUP_MODE: ${{ inputs.warmup_mode }}
          WARMUP_TOP_N: ${{ inputs.warmup_top_n }}
          WARMUP_SCORE_FLOOR: ${{ inputs.warmup_score_floor }}
        run: |
          PROVIDER=$(yq '.crm.provider // "none"' company-profile.yaml)
          if [ "$PROVIDER" != "none" ] && [ -z "$CRM_API_KEY" ]; then
            echo "::warning::crm.provider is '$PROVIDER' but its API key secret is unset — upserting to the local store only."
            export CRM_PROVIDER=none
          fi
          python - <<'PYEOF'
          import json, os, sys
          from pathlib import Path
          from datetime import date

          sys.path.insert(0, "lib")
          import crm
          import eu_router
          import suppression

          # Load qualifier-critic verdicts (all files — leads may have been
          # scored on a prior run). Fail closed: a lead with no verdict is
          # escalated, never upserted.
          verdicts = {}
          critic_dir = Path("leads/critic")
          for vf in sorted(critic_dir.glob("*.json")) if critic_dir.exists() else []:
              try:
                  for v in json.loads(vf.read_text()):
                      verdicts[v.get("lead_email", "").lower()] = v
              except Exception as e:
                  print(f"Bad verdict file {vf}: {e}")

          if not verdicts:
              print("FAIL-CLOSED: no qualifier-critic verdicts found in leads/critic/ — refusing to upsert.")
              sys.exit(1)

          # Warmup override: promote top-N FAIL verdicts (score >= floor) to
          # PASS so a real-send warmup can proceed while the rubric is being
          # tuned for cold outbound. The rubric itself is untouched — only the
          # verdict decisions are modified, and each promoted record is
          # marked so the audit trail is preserved. Downstream consumers
          # (sequence-enrollment) read the critic files from disk, so the
          # promotion is written back to disk after the in-memory update.
          promoted_emails: set[str] = set()
          if os.environ.get("WARMUP_MODE", "").lower() == "true":
              top_n = int(os.environ.get("WARMUP_TOP_N", "15"))
              floor = int(os.environ.get("WARMUP_SCORE_FLOOR", "30"))
              fails = sorted(
                  [v for v in verdicts.values()
                   if v.get("decision") == "FAIL"
                   and (v.get("normalized_score", 0) or 0) >= floor
                   and not v.get("disqualifier_hits")],  # never promote a disqualifier hit
                  key=lambda x: -(x.get("normalized_score", 0) or 0),
              )
              for v in fails[:top_n]:
                  v["decision"] = "PASS"
                  v["warmup_promoted"] = True
                  v["original_decision"] = "FAIL"
                  promoted_emails.add(v.get("lead_email", "").lower())
              print(f"WARMUP_MODE: promoted {len(promoted_emails)} FAIL verdicts to PASS "
                    f"(top {top_n} by score, floor >= {floor}, no disqualifier hits).")

              # Persist promotions back to the critic files on disk so
              # downstream (sequence-enrollment) sees them.
              if promoted_emails:
                  for vf in critic_dir.glob("*.json"):
                      try:
                          entries = json.loads(vf.read_text())
                      except Exception:
                          continue
                      dirty = False
                      for entry in entries:
                          e = (entry.get("lead_email") or "").lower()
                          if e in promoted_emails and entry.get("decision") != "PASS":
                              entry["decision"] = "PASS"
                              entry["warmup_promoted"] = True
                              entry["original_decision"] = "FAIL"
                              dirty = True
                      if dirty:
                          vf.write_text(json.dumps(entries, indent=2, ensure_ascii=False))
                          print(f"  updated {vf}")

          enriched_dir = Path("leads/enriched")
          upserted, skipped, escalated = [], [], []

          for f in sorted(enriched_dir.glob("*.json")) if enriched_dir.exists() else []:
              try:
                  leads = json.loads(f.read_text())
              except Exception as e:
                  print(f"Skipping {f}: {e}")
                  continue
              if not isinstance(leads, list):
                  leads = [leads]

              for lead in leads:
                  email = lead.get("email", "")
                  name = lead.get("contact_name", "")
                  company = lead.get("company_name", "")

                  if not email:
                      skipped.append(f"{name} / {company} — no email")
                      continue

                  if suppression.check(email):
                      skipped.append(f"{name} / {company} — suppressed")
                      continue

                  verdict = verdicts.get(email.lower())
                  if verdict is None:
                      escalated.append(f"{name} / {company} — NO VERDICT (fail-closed, not upserted)")
                      continue
                  if verdict.get("decision") == "ESCALATE":
                      escalated.append(f"{name} / {company} — ESCALATE ({verdict.get('reason', '')})")
                      continue
                  if verdict.get("decision") != "PASS":
                      skipped.append(f"{name} / {company} — critic FAIL {verdict.get('normalized_score')}/100: {verdict.get('reason', '')}")
                      continue

                  existing = crm.get_contact(email)
                  if existing and existing.get("sequence_status"):
                      skipped.append(f"{name} / {company} — prior contact ({existing['sequence_status']})")
                      continue

                  country = lead.get("country_code", "")
                  is_eu = bool(country and eu_router.is_eu(country))

                  data = {
                      "contact_name": name,
                      "email": email,
                      "company_name": company,
                      "contact_title": lead.get("contact_title", ""),
                      "icp_segment": lead.get("icp_segment", ""),
                      "sequence_status": "pending",
                      "outreach_channel": "linkedin_only" if is_eu else "email",
                      "eu_contact": is_eu,
                      "suppressed": False,
                  }

                  try:
                      crm.upsert_contact(data)
                      upserted.append(f"{name} / {company} ({'linkedin_only' if is_eu else 'email'})")
                  except Exception as e:
                      # Record the intended upsert as an audit line rather
                      # than blocking the run (e.g. CRM schema not yet
                      # provisioned with the pipeline's custom fields).
                      skipped.append(f"{name} / {company} — CRM error: {e}")

          print(f"\n{'='*60}")
          print(f"CRM upsert complete — {date.today().isoformat()}")
          print(f"{'='*60}")
          print(f"Upserted as pending: {len(upserted)}")
          for u in upserted:
              print(f"  + {u}")
          if escalated:
              print(f"\nEscalated for human review (NOT upserted): {len(escalated)}")
              for e in escalated:
                  print(f"  ! {e}")
          if skipped:
              print(f"\nSkipped: {len(skipped)}")
              for s in skipped:
                  print(f"  - {s}")
          print("\nNext step: run the Sequence Enrollment workflow to draft touches; approve by merging the PR it opens.")
          PYEOF

      # If warmup_mode wrote promoted verdicts back to leads/critic/, commit
      # them so sequence-enrollment (which reads the critic files from disk)
      # sees the promotions on its next run. The local CRM store may also
      # have changed (crm.provider: none writes to leads/crm-local/).
      - name: Commit warmup promotions and local CRM state
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -z "$(git status --porcelain leads/critic/ leads/crm-local/)" ]; then
            echo "No promotions or local CRM changes to persist."
            exit 0
          fi
          git config user.name "gtm-agent"
          git config user.email "agent@users.noreply.github.com"
          git add leads/critic/ leads/crm-local/
          git commit -m "dedup-review: verdict promotions + local CRM state $(date +%F)

          Agent: dedup-review
          Agent-Model: claude-code
          Triggered-By: dedup-review.yml"
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            echo "Push rejected (attempt $i/5); rebasing on origin/main..."
            git pull --rebase origin main
            sleep $((i * 2))
          done

      # In find-and-draft mode the pipeline keeps going: qualified leads get
      # outreach drafted and an approval PR opened. In find-leads mode it
      # stops here with a scored lead list and writes no outreach — that's
      # the difference between the two modes. Merging the PR that
      # sequence-enrollment opens is still the only thing that can send.
      - name: Trigger sequence-enrollment (find-and-draft mode)
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.drafts == 'true' && inputs.skip_downstream != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run sequence-enrollment.yml \
            --repo ${{ github.repository }} \
            --ref main

      - name: Note stopping point (find-leads mode)
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.drafts != 'true'
        run: |
          echo "::notice::Scored lead list is ready in leads/critic/. company.mode is '${{ steps.gate.outputs.mode }}', so no outreach was drafted. Set company.mode to 'find-and-draft' to have drafts written for your approval."
