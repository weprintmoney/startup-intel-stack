# Weekly Intelligence Digest. Every Friday, synthesizes the week's agent output
# (competitive signals, engineering signals, AEO results, any monitor files) into a
# single leadership digest, opens a PR, and optionally posts the summary to Slack.
#
# Simplified from a source pipeline that ran a second extraction agent and routed to
# named executives; here one agent produces digest + action items in a single pass.
#
# Tier: pre-seed (digests run at every tier).
# Required secrets: ANTHROPIC_API_KEY (skips gracefully if absent).
# Optional secrets: SLACK_WEBHOOK_URL (digest summary + failure notifications).
name: Weekly Intelligence Digest

on:
  schedule:
    - cron: "0 15 * * 5" # Fridays 15:00 UTC — keep in sync with cadences.weekly_digest in company-profile.yaml (add the key when you customize)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Stage gate
        id: gate
        run: |
          STAGE=$(yq '.company.stage' company-profile.yaml)
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          # digests run at every tier; no skip

      - name: Run weekly digest agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "ANTHROPIC_API_KEY not set — skipping"; exit 0; fi
          npm install -g @anthropic-ai/claude-code
          claude -p "Produce this week's intelligence digest.
          1. Read company-profile.yaml for context. Collect all files dated within the
             last 7 days under docs/01-market-intelligence/signals/ and
             docs/04-marketing/aeo/, plus any agent-opened PRs and aeo-gap issues from
             the last 7 days (gh pr list / gh issue list).
          2. Synthesize into docs/01-market-intelligence/signals/$(date +%F)-weekly-digest.md
             with standard frontmatter. Sections: (a) TL;DR — 3 bullets max;
             (b) Competitive moves that matter; (c) Market/regulatory items;
             (d) Content & AEO status; (e) Action needed this week — max 3 decisions,
             each with a suggested owner role (founder / sales / marketing / eng) from
             the people list in company-profile.yaml. Ground every item in a link to
             its source file, PR, or URL. If a section has nothing, write 'Quiet week.'
          3. Also write the digest's TL;DR + action items as plain text (under 500
             chars) to /tmp/digest-summary.txt for the Slack step.
          4. git config user.name 'gtm-agent'; git config user.email
             'agent@users.noreply.github.com'; branch weekly-digest/$(date +%F);
             commit with the trailers 'Agent: ci' and 'Triggered-By: weekly-digest.yml';
             push; open a PR titled 'weekly digest: $(date +%F)'.
          Do NOT post to Slack yourself — the workflow handles that." \
          --allowedTools "Bash,Read,Write,Edit,Glob,Grep"

      - name: Post summary to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then echo "SLACK_WEBHOOK_URL not set — skipping"; exit 0; fi
          [ -f /tmp/digest-summary.txt ] || exit 0
          PR_URL=$(gh pr list --search "weekly digest: $(date +%F)" \
            --repo "${{ github.repository }}" --json url --jq '.[0].url' 2>/dev/null || echo "")
          MSG="$(cat /tmp/digest-summary.txt)"
          [ -n "$PR_URL" ] && MSG="$MSG
          Full digest: $PR_URL"
          curl -sS -X POST "$SLACK_WEBHOOK_URL" -H 'Content-type: application/json' \
            -d "$(jq -n --arg text "$MSG" '{text: $text}')"

      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then echo "SLACK_WEBHOOK_URL not set — skipping"; exit 0; fi
          curl -sS -X POST "$SLACK_WEBHOOK_URL" -H 'Content-type: application/json' \
            -d "{\"text\":\"Workflow failed: ${{ github.workflow }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
