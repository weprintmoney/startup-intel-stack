# PR Comment Resolver. When a human leaves a review comment on a PR that was opened
# by automation (the agents in this repo), this workflow reads the comment, makes the
# requested change on the PR branch, commits, and replies to the thread. This is what
# makes "leave comments — the bot will iterate" work on agent-opened PRs.
#
# Scope: only fires on PRs authored by a bot account. Loop prevention: never fires on
# comments made by github-actions[bot]. Concurrency: one run per PR at a time.
#
# Mode: any (event-driven; it services whatever agents are active).
# Required secrets: ANTHROPIC_API_KEY (skips gracefully if absent).
name: PR Comment Resolver

on:
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-comment-resolver-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only fire on bot-opened PRs; never re-trigger on our own comments
    if: |
      github.actor != 'github-actions[bot]' &&
      contains(github.event.pull_request.user.login, 'bot')
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Stage gate
        run: |
          MODE=$(yq '.company.mode // .company.stage // ""' company-profile.yaml)
          echo "mode=$MODE"
          # runs in every mode — it services PRs opened by whatever agents are active

      - name: Resolve comment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMENT_BODY: ${{ github.event.comment.body || github.event.review.body }}
          COMMENT_ID: ${{ github.event.comment.id || github.event.review.id }}
          COMMENT_PATH: ${{ github.event.comment.path || '' }}
          COMMENT_LINE: ${{ github.event.comment.line || '' }}
          COMMENTER: ${{ github.actor }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "ANTHROPIC_API_KEY not set — skipping"; exit 0; fi
          if [ -z "$COMMENT_BODY" ]; then echo "Empty review body — nothing to resolve"; exit 0; fi
          npm install -g @anthropic-ai/claude-code
          claude -p "You are resolving a review comment on PR #$PR_NUMBER
          ('$PR_TITLE') in this repo. You are already checked out on the PR branch.
          The comment (from $COMMENTER, id $COMMENT_ID, file '$COMMENT_PATH' line
          '$COMMENT_LINE'): $COMMENT_BODY
          1. Read the referenced file(s) and any content-ops reference docs relevant
             to the change (docs/04-marketing/content-ops/reference/ — especially
             claims-vetted.md: never introduce a claim that isn't vetted).
          2. Make exactly the requested change. If the request is unclear or would
             violate a reference rule, do NOT change files — reply on the thread
             explaining why and what you'd suggest instead.
          3. If you changed files: git config user.name 'gtm-agent'; git config
             user.email 'agent@users.noreply.github.com'; commit to the current branch
             with a message describing the change plus the trailers 'Agent: ci' and
             'Triggered-By: pr-comment-resolver.yml'; push.
          4. Reply to the comment thread (gh api or gh pr comment) confirming what
             changed, quoting the relevant new text." \
          --allowedTools "Bash,Read,Write,Edit,Glob,Grep"

      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then echo "SLACK_WEBHOOK_URL not set — skipping"; exit 0; fi
          curl -sS -X POST "$SLACK_WEBHOOK_URL" -H 'Content-type: application/json' \
            -d "{\"text\":\"Workflow failed: ${{ github.workflow }} (PR #${{ github.event.pull_request.number }}) — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
