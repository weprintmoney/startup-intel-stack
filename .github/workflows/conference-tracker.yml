# Conference & Events Tracker — VERTICAL-DEPENDENT, OFF BY DEFAULT.
# Only useful once you know which conferences your buyers and community attend, and
# events are part of your GTM motion. Seed the tracked-events list first (the agent
# creates docs/01-market-intelligence/conference-tracker.md on first run — edit it),
# then uncomment the cron below; otherwise leave it dispatch-only or delete the file.
#
# Weekly sweep of tracked events: CFP deadlines (flagged when within 6 weeks, with a
# suggested abstract angle), agenda announcements, competitor presence, and post-event
# recaps. Opens a PR updating the tracker doc.
#
# Mode: docs-only (signals run in every mode).
# Required secrets: ANTHROPIC_API_KEY (skips gracefully if absent).
# Optional secrets: SLACK_WEBHOOK_URL (failure notifications).
name: Conference Tracker

on:
  # Uncomment to enable the weekly run once your tracked-events list is seeded:
  # schedule:
  #   - cron: "30 5 * * 1" # Mondays 05:30 UTC — keep in sync with cadences.conference_tracker in company-profile.yaml (add the key when you customize)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  conferences:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Stage gate
        id: gate
        run: |
          MODE=$(yq '.company.mode // .company.stage // ""' company-profile.yaml)
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          # signals run in every mode; no skip

      - name: Run conference tracker agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "ANTHROPIC_API_KEY not set — skipping"; exit 0; fi
          npm install -g @anthropic-ai/claude-code
          claude -p "Run this week's conference & events tracker.
          1. Read docs/01-market-intelligence/conference-tracker.md. If it does not
             exist, bootstrap it: read company-profile.yaml (icp.verticals,
             one_liner) and propose 8-12 conferences/events our buyers and community
             attend, as a table with columns: event, date, location, CFP deadline,
             why we care, competitor presence, status. Mark the file as a proposed
             seed list for the founder to edit.
          2. For each tracked event, check its site for: CFP open/deadline changes,
             newly published agenda or speaker lists, and recaps if the event just
             ran. Flag any tracked competitor speaking or sponsoring.
          3. Any CFP deadline within 6 weeks gets a prominent '## CFP deadlines'
             section at the top with a one-paragraph suggested abstract angle drawn
             from our positioning docs (docs/01-market-intelligence/).
          4. Update the tracker doc (refresh last_reviewed); git config user.name
             'gtm-agent'; git config user.email 'agent@users.noreply.github.com';
             branch conference-tracker/$(date +%F); commit with the trailers
             'Agent: ci' and 'Triggered-By: conference-tracker.yml'; push; open a PR
             titled 'conference tracker: $(date +%F)' — always open the PR, this is a
             standing weekly update even on quiet weeks; mention imminent CFP
             deadlines in the title if any." \
          --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch"

      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then echo "SLACK_WEBHOOK_URL not set — skipping"; exit 0; fi
          curl -sS -X POST "$SLACK_WEBHOOK_URL" -H 'Content-type: application/json' \
            -d "{\"text\":\"Workflow failed: ${{ github.workflow }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
