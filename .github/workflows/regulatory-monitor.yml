# Regulatory & Compliance Monitor — VERTICAL-DEPENDENT, OFF BY DEFAULT.
# Only useful if you sell into regulated verticals (healthcare, fintech, government,
# defense) or your buyers' compliance posture drives purchase decisions. If that's
# you, uncomment the cron below; otherwise leave it dispatch-only or delete the file.
#
# Weekly sweep of regulator announcements, enforcement actions, and framework changes
# relevant to icp.verticals; opens a PR with a dated signals file only when something
# material happened.
#
# Simplified from a source pipeline with a headless-browser scraping stack and a
# hardcoded vertical list; here the agent derives its beat from company-profile.yaml
# and works with WebSearch/WebFetch.
#
# Mode: docs-only (signals run in every mode).
# Required secrets: ANTHROPIC_API_KEY (skips gracefully if absent).
# Optional secrets: SLACK_WEBHOOK_URL (failure notifications).
name: Regulatory Monitor

on:
  # Uncomment to enable the weekly run once you've confirmed this fits your vertical:
  # schedule:
  #   - cron: "30 6 * * 1" # Mondays 06:30 UTC — keep in sync with cadences.regulatory_monitor in company-profile.yaml (add the key when you customize)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  regulatory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Stage gate
        id: gate
        run: |
          MODE=$(yq '.company.mode // .company.stage // ""' company-profile.yaml)
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          # signals run in every mode; no skip

      - name: Run regulatory monitor agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "ANTHROPIC_API_KEY not set — skipping"; exit 0; fi
          npm install -g @anthropic-ai/claude-code
          claude -p "Run this week's regulatory & compliance monitor.
          1. Read company-profile.yaml — icp.verticals and icp.geographies define
             your beat. Map each vertical to its regulators and frameworks (e.g.
             healthcare -> HHS/HIPAA; fintech -> SEC/FINRA; federal -> FedRAMP/FISMA;
             EU geography -> GDPR/EU AI Act). If verticals is empty, note that in the
             run log and exit cleanly — this workflow needs a configured ICP.
          2. Search regulator newsrooms, enforcement-action pages, and framework
             change logs for items from the last 7 days that would change what our
             buyers must do, or that a prospect would raise on a sales call.
          3. Flag CRITICAL anything that directly affects our category's
             compliance story (a competitor gaining a major authorization, a new rule
             covering our product category, a headline enforcement action in a target
             vertical).
          4. No file = no signal: if nothing material, exit cleanly without writing.
          5. Otherwise write
             docs/01-market-intelligence/signals/$(date +%F)-regulatory-signals.md
             with standard frontmatter and inline citations next to each claim;
             git config user.name 'gtm-agent'; git config user.email
             'agent@users.noreply.github.com'; branch regulatory-signals/$(date +%F);
             commit with the trailers 'Agent: ci' and
             'Triggered-By: regulatory-monitor.yml'; push; open a PR titled
             'regulatory signals: $(date +%F)' — include 'CRITICAL' in the title if
             any item was flagged CRITICAL." \
          --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch"

      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then echo "SLACK_WEBHOOK_URL not set — skipping"; exit 0; fi
          curl -sS -X POST "$SLACK_WEBHOOK_URL" -H 'Content-type: application/json' \
            -d "{\"text\":\"Workflow failed: ${{ github.workflow }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
