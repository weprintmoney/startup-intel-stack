# company-profile.yaml — the single place where company-specific parameters live.
# Every agent and workflow reads this file. /gtm-init fills it in for you.

company:
  name: "ACME AI"                  # legal/brand name as used in copy
  domain: "acme.ai"                # primary web domain (NEVER used as send domain)
  send_domain: "mail.acme.ai"      # dedicated send subdomain or alt domain
  one_liner: ""                    # <=20 words, what you do and for whom
  founded: ""                      # YYYY-MM
  hq_timezone: "America/Chicago"

  # How much of the system is switched on. Each mode includes the one above it.
  #
  #   docs-only       Research and writing only: market and competitor signals,
  #                   positioning, ICP, personas, brand voice, content ops.
  #                   Touches no contact data. Safe place to start.
  #
  #   find-leads      + the lead pipeline: crawl, dedup, pre-filter, enrich, and
  #                   score against your rubric. You get a qualified lead list.
  #                   Writes no outreach. NOTE: sourcing contacts needs either an
  #                   APOLLO_API_KEY (paid) or a contact-list CSV you export
  #                   yourself — without one, the crawl finds nothing. See
  #                   agents/crawler/CLAUDE.md.
  #
  #   find-and-draft  + drafts outreach for qualified leads and opens an approval
  #                   PR for you, + sends what you approve there. Nothing is ever
  #                   emailed without your explicit approval, in any mode.
  #
  # Older instances may still say `stage:` with pre-seed / seed / series-a —
  # those are accepted as aliases for the three modes above, in order.
  mode: "docs-only"

people:
  # Used for sender personas, notification routing, and CODEOWNERS.
  - name: ""
    role: "founder"                # founder | sales | marketing | eng
    email: ""
    github: ""
    sender_persona: true           # can outbound email go out under this name?

icp:
  # Filterable criteria the crawler/pre-filter/qualifier agents apply.
  verticals: []                    # e.g. ["fintech", "healthcare AI"]
  company_size: { min: 20, max: 2000 }
  geographies: ["US"]              # EU contacts are auto-routed to LinkedIn-only (no SMTP)
  locations: []                    # OPTIONAL metro constraint for a local/regional ICP. Empty = no metro filter (country-level only).
  # Read by crawler, pre-filter, event-ingest, apify-ingest, enrichment (step 6b) and qualifier-critic A7.
  # Agents text-match `city` + `aliases` (nothing geocodes); `radius_miles` is the tie-break instruction for unlisted towns.
  # - metro: "Springfield, IL"
  #   city: "Springfield"
  #   region: "Illinois"
  #   country_code: "US"
  #   radius_miles: 40
  #   aliases: ["Chatham", "Sherman", "Rochester", "Riverton"]
  #   include_remote_hq_with_local_office: true   # HQ elsewhere + a staffed local office counts as in-metro
  #   apollo_location: "Springfield, Illinois, United States"   # exact string for Apollo person_locations[] / organization_locations[]
  buyer_titles: []                 # e.g. ["VP Engineering", "Head of AI", "CTO"]
  disqualifiers: []                # hard-fail conditions, e.g. ["direct competitor", "agency"]
  profile_agent: "stack"           # stack | org-context — the per-company research stage between enrichment and the critic. stack = tech stack from public code/manifests (software buyers); org-context = offices, People leader, people-side signals, culture language (any other buyer)
  qualification_thresholds:
    pre_seed_pass: 60              # relaxed bar for leads that are themselves pre-seed companies (see rubrics/pre-seed-qualifier.md)
    standard_pass: 70
    copy_pass: 80

competitors:
  # Drives competitive-signals monitoring and outbound suppression.
  - name: ""
    domain: ""

channels:
  slack_webhook_secret: ""         # name of the GitHub secret holding the webhook (optional)
  linkedin_handle: ""
  x_handle: ""
  blog_path: ""                    # where published content lives, if any

sending:
  provider: "resend"               # resend | sendgrid | mailgun (see lib/smtp_send)
  daily_cap: 100
  send_window: { days: "Mon-Fri", start: "08:00", end: "18:00" }
  warmup_ramp_days: 28

crm:
  provider: "none"                 # none | attio | airtable (see lib/crm adapter)
  api_key_secret: ""               # name of the GitHub secret holding the key

cadences:
  # Cron schedules (UTC). Stagger these if you fork multiple instances.
  competitive_signals: "0 4 * * 1"   # Mon 4am
  aeo_monitoring: "0 5 * * 1"        # Mon 5am
  weekly_crawl: "0 13 * * 1"         # Mon 8am ET
  feedback_loop: "0 13 1 * *"        # monthly, 1st
